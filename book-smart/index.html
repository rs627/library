s, plus where to get help', later: true }\n    ];\n    const lessons = data.map((l) => {\n      const later = !!l.later;\n      return Object.assign({}, l, {\n        ready: !later && (open || l.n === 1), later, locked: !later && !open && l.n > 1, lockNote: 'Opens after Lesson ' + (l.n - 1),\n        tag: later ? 'Coming later' : 'Lesson ' + l.n,\n        cardStyle: 'position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:14px;box-sizing:border-box;min-height:380px;' + (later ? 'background:#F4F6F9;border:2px dashed #9AA5BC' : 'background:#FFFFFF;border:1px solid #D3D7DE;box-shadow:0 4px 14px rgba(1,33,105,0.06)'),\n        numStyle: 'position:relative;z-index:1;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;' + (later ? 'background:#FFFFFF;color:#46506A;border:2px dashed #9AA5BC' : 'background:#012169;color:#FFFFFF;border:4px solid #E9ECF1'),\n        tagStyle: 'font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;' + (later ? 'background:#E1E5EC;color:#46506A' : 'background:#E8ECF6;color:#012169')\n      });\n    });\n    return {\n      lessons,\n      outcomes: [\n        'Choose between Google and the catalog at each step of your research',\n        'Build a search strategy with concepts, other words, AND and OR',\n        'Read a book record and find a book on the shelf by its call number',\n        'Find an ebook and open it through Duke, even off campus'\n      ]\n    };\n  }\n}", "title": "Book Smart: module map"}, "Why.dc.html": {"tpl": "<div style=\"width: 100%; min-height: 1500px; box-sizing: border-box; background: #E9ECF1; font-family: 'Noto Sans', system-ui, sans-serif; color: #262626; padding: 24px; display: flex; flex-direction: column; gap: 20px\">\n\n  <div style=\"max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; background: #1B2333; color: #FFFFFF; border-radius: 12px; padding: 18px 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n      <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F2C14E\">Lesson 1 of 5<\/div>\n      <div style=\"font-size: 24px; font-weight: 800\">Why use the library catalog?<\/div>\n      <div style=\"font-size: 15px; color: #D5DAE3\">Google and the catalog play different parts in your research. Learn when to use each.<\/div>\n    <\/div>\n    <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 8px\">\n      <div style=\"font-size: 14px; font-weight: 600; color: #D5DAE3\">{{doneCount}} of 3 activities done<\/div>\n      <div style=\"width: 220px; height: 8px; border-radius: 4px; background: #3A4458; overflow: hidden\"><div style=\"{{barStyle}}\"><\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <nav aria-label=\"Lesson parts\" style=\"max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box\">\n    <div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px\">\n      <sc-for list=\"{{parts}}\" as=\"p\" hint-placeholder-count=\"5\">\n        <button type=\"button\" onClick=\"{{p.go}}\" aria-current=\"{{p.current}}\" style=\"{{p.style}}\">\n          <span style=\"{{p.numStyle}}\">{{p.n}}<\/span>\n          <span style=\"font-size: 14px; font-weight: 700; line-height: 1.25; text-align: left\">{{p.name}}<\/span>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n  <\/nav>\n\n  <div style=\"max-width: 1100px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n\n    <sc-if value=\"{{isP0}}\" hint-placeholder-val=\"{{ true }}\">\n      <section aria-labelledby=\"s1\" style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 32px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center\">\n        <div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Part 1 of 5 · Scenario<\/div>\n          <h2 id=\"s1\" style=\"margin: 0; font-size: 26px; line-height: 1.35; color: #1B2333\">Your Writing 120 instructor wants you to bring one book on your research topic to class on Friday.<\/h2>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #333333\">You’ll probably use both Google and the library catalog for this, but for different jobs. This lesson shows which tool fits each step of your research.<\/p>\n        <\/div>\n        <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 12px; background: #F4F6F9\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Your research question<\/div>\n          <div style=\"font-size: 20px; font-weight: 700; line-height: 1.4; color: #1B2333\">How is <span style=\"background: #FFF4D6; padding: 0 4px\">generative AI<\/span> changing ideas of <span style=\"background: #FFF4D6; padding: 0 4px\">authorship<\/span> in <span style=\"background: #FFF4D6; padding: 0 4px\">college writing<\/span>?<\/div>\n          <div style=\"display: flex; gap: 16px; padding-top: 8px; border-top: 1px solid #DDE1E8\">\n            <div style=\"display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1B2333\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2333\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"><\/path><\/svg>Google<\/div>\n            <div style=\"font-size: 14px; color: #5A6478\">+<\/div>\n            <div style=\"display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1B2333\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2333\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z\"><\/path><\/svg>Library catalog<\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n    <\/sc-if>\n\n    <sc-if value=\"{{isP2}}\" hint-placeholder-val=\"{{ false }}\">\n      <section aria-labelledby=\"s2\" style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 22px\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Part 3 of 5 · Your research, step by step<\/div>\n          <h2 id=\"s2\" style=\"margin: 0; font-size: 24px; color: #1B2333\">Each step of research calls for a different tool<\/h2>\n          <div style=\"font-size: 16px; color: #46506A\">Select each step on the timeline to compare what Google and the catalog do there.<\/div>\n        <\/div>\n\n        <div role=\"group\" aria-label=\"Research steps\" style=\"position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px\">\n          <div aria-hidden=\"true\" style=\"position: absolute; left: 10%; right: 10%; top: 27px; height: 4px; border-radius: 2px; background: #D3D7DE\"><\/div>\n          <sc-for list=\"{{stages}}\" as=\"g\" hint-placeholder-count=\"5\">\n            <button type=\"button\" onClick=\"{{g.pick}}\" aria-pressed=\"{{g.pressed}}\" style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 4px 8px; border: none; background: transparent; cursor: pointer; min-height: 44px\">\n              <span style=\"{{g.dot}}\">{{g.n}}<\/span>\n              <span style=\"{{g.labelStyle}}\">{{g.name}}<\/span>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n          <div style=\"border: 1px solid #D3D7DE; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n              <span style=\"display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #1B2333\"><svg aria-hidden=\"true\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2333\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"><\/path><\/svg>Google<\/span>\n              <span style=\"{{stage.gTagStyle}}\">{{stage.gTag}}<\/span>\n            <\/div>\n            <div style=\"font-size: 16px; line-height: 1.6; color: #333333\">{{stage.g}}<\/div>\n          <\/div>\n          <div style=\"border: 2px solid #012169; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n              <span style=\"display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #012169\"><svg aria-hidden=\"true\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z\"><\/path><\/svg>Library catalog<\/span>\n              <span style=\"{{stage.cTagStyle}}\">{{stage.cTag}}<\/span>\n            <\/div>\n            <div style=\"font-size: 16px; line-height: 1.6; color: #333333\">{{stage.c}}<\/div>\n          <\/div>\n        <\/div>\n        <div style=\"display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.6; color: #1B2333; background: #F4F6F9; border-radius: 10px; padding: 16px 18px\">\n          <svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z\"><\/path><\/svg>\n          <span><strong>The takeaway:<\/strong> Use Google to learn about a topic and find words for it. Use the catalog to find sources you can read, cite and actually get.<\/span>\n        <\/div>\n      <\/section>\n    <\/sc-if>\n\n    <sc-if value=\"{{isP1}}\" hint-placeholder-val=\"{{ false }}\">\n      <section aria-labelledby=\"s3\" style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Part 2 of 5 · How they differ<\/div>\n        <h2 id=\"s3\" style=\"margin: 0; font-size: 24px; color: #1B2333\">Google and the catalog, side by side<\/h2>\n        <div role=\"table\" aria-label=\"How Google and the library catalog differ\" style=\"border: 1px solid #B9C1D0; border-radius: 12px; overflow: hidden\">\n          <div role=\"row\" style=\"display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.3fr) minmax(0, 1.3fr); background: #F4F6F9; border-bottom: 2px solid #1B2333\">\n            <div role=\"columnheader\" style=\"padding: 14px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #46506A; display: flex; align-items: center\">Compare<\/div>\n            <div role=\"columnheader\" style=\"padding: 14px 18px; border-left: 1px solid #B9C1D0; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #1B2333\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2333\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"><\/path><\/svg>Google<\/div>\n            <div role=\"columnheader\" style=\"padding: 14px 18px; border-left: 1px solid #B9C1D0; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #012169; background: #E8ECF6\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z\"><\/path><\/svg>Library catalog<\/div>\n          <\/div>\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div role=\"row\" style=\"{{r.rowStyle}}\">\n              <div role=\"rowheader\" style=\"padding: 16px 18px; font-size: 15px; font-weight: 700; line-height: 1.4; color: #1B2333\">{{r.k}}<\/div>\n              <div role=\"cell\" style=\"padding: 16px 18px; border-left: 1px solid #D3D7DE; font-size: 16px; line-height: 1.55; color: #333333\">{{r.g}}<\/div>\n              <div role=\"cell\" style=\"padding: 16px 18px; border-left: 1px solid #D3D7DE; font-size: 16px; line-height: 1.55; color: #1B2333; background: #F5F7FC\">{{r.c}}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n    <\/sc-if>\n\n    <sc-if value=\"{{isP3}}\" hint-placeholder-val=\"{{ false }}\">\n      <section aria-labelledby=\"s4\" style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n          <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Part 4 of 5 · Quick check 1<\/span>\n          <span style=\"font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #E8ECF6; color: #012169\">Step 2 · Choose keywords<\/span>\n        <\/div>\n        <h2 id=\"s4\" style=\"margin: 0; font-size: 24px; line-height: 1.4; color: #1B2333\">Build a search strategy for your question<\/h2>\n        <div style=\"font-size: 16px; line-height: 1.6; color: #46506A\">Google can take your whole question. The catalog does better with a strategy: the main concepts, plus other words for each one.<\/div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 20px; background: #F4F6F9; border-radius: 12px\">\n          <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 14px; background: #1B2333; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">1<\/span><span style=\"font-size: 17px; font-weight: 700; color: #1B2333\">Select the three main concepts in your question<\/span><\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n            <sc-for list=\"{{words}}\" as=\"w\" hint-placeholder-count=\"9\">\n              <button type=\"button\" onClick=\"{{w.pick}}\" aria-pressed=\"{{w.pressed}}\" style=\"{{w.style}}\">{{w.t}}<\/button>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start\">\n            <button type=\"button\" onClick=\"{{checkConcepts}}\" style=\"min-height: 44px; padding: 0 20px; border-radius: 10px; border: none; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">Check concepts<\/button>\n            <sc-if value=\"{{conceptsChecked}}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"status\" style=\"{{conceptFbStyle}}\">\n                <div style=\"display: flex; align-items: center; gap: 8px; font-weight: 800\">\n                  <sc-if value=\"{{conceptsOk}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#0B6E69\"><circle cx=\"12\" cy=\"12\" r=\"11\"><\/circle><path d=\"M7 12.5l3.2 3.2L17 9\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/sc-if>\n                  <sc-if value=\"{{conceptsBad}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#B04A00\"><circle cx=\"12\" cy=\"12\" r=\"11\"><\/circle><path d=\"M12 7v6M12 16.5v.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\/path><\/svg><\/sc-if>\n                  <span>{{conceptVerdict}}<\/span>\n                <\/div>\n                <div>{{conceptFb}}<\/div>\n              <\/div>\n            <\/sc-if>\n          <\/div>\n        <\/div>\n\n        <sc-if value=\"{{showPart2}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 14px; background: #1B2333; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">2<\/span><span style=\"font-size: 17px; font-weight: 700; color: #1B2333\">Sort these terms<\/span><\/div>\n              <div style=\"font-size: 15px; line-height: 1.6; color: #46506A\">Authors don’t all use the same words. Select a term, then add it to the concept it’s another way of saying. Some terms don’t belong in this search at all. Select a placed term to send it back.<\/div>\n            <\/div>\n            <sc-if value=\"{{notSimple}}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-items: center; padding: 14px; border: 2px dashed #B9C1D0; border-radius: 10px\">\n                <sc-for list=\"{{bank}}\" as=\"b\" hint-placeholder-count=\"12\">\n                  <button type=\"button\" onClick=\"{{b.pick}}\" aria-pressed=\"{{b.pressed}}\" style=\"{{b.style}}\">{{b.t}}<\/button>\n                <\/sc-for>\n                <sc-if value=\"{{bankEmpty}}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size: 14px; color: #5A6478\">All terms sorted. Check your strategy.<\/span>\n                <\/sc-if>\n              <\/div>\n            <\/sc-if>\n            <sc-if value=\"{{simple}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 10px; background: #FFF8E6; border: 2px solid #F2C14E\">\n                <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5300\">One at a time · {{qProgress}}<\/div>\n                <div style=\"font-size: 20px; font-weight: 700; line-height: 1.4; color: #1B2333\">Where does <span style=\"background: #FFFFFF; padding: 2px 10px; border-radius: 16px; border: 1px solid #C78A00\">{{qTerm}}<\/span> belong?<\/div>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n                  <sc-for list=\"{{qOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <button type=\"button\" onClick=\"{{o.pick}}\" style=\"{{o.style}}\">{{o.name}}<\/button>\n                  <\/sc-for>\n                <\/div>\n                <sc-if value=\"{{hasHint}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size: 15px; line-height: 1.55; color: #262626; background: #FFFFFF; border-radius: 8px; padding: 10px 14px\"><strong>Hint:<\/strong>     <\/div>\n              <\/div>\n              <div style=\"flex: 1 1 360px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n                <figure style=\"margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; border-radius: 12px; background: #F4F6F9\">\n                  <svg role=\"img\" aria-label=\"OR: two overlapping circles, both fully shaded. Results can match either word.\" width=\"140\" height=\"84\" viewBox=\"0 0 140 84\">\n                    <circle cx=\"52\" cy=\"42\" r=\"34\" fill=\"#012169\" fill-opacity=\"0.55\" stroke=\"#012169\" stroke-width=\"2\"><\/circle>\n                    <circle cx=\"88\" cy=\"42\" r=\"34\" fill=\"#012169\" fill-opacity=\"0.55\" stroke=\"#012169\" stroke-width=\"2\"><\/circle>\n                    <text x=\"40\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#FFFFFF\">AI<\/text>\n                    <text x=\"100\" y=\"47\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#FFFFFF\">ChatGPT<\/text>\n                  <\/svg>\n                  <figcaption style=\"font-size: 14px; line-height: 1.4; text-align: center; color: #1B2333\"><strong style=\"font-family: 'IBM Plex Mono', monospace\">OR<\/strong> widens: either word counts<\/figcaption>\n                <\/figure>\n                <figure style=\"margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; border-radius: 12px; background: #F4F6F9\">\n                  <svg role=\"img\" aria-label=\"AND: two overlapping circles, only the overlap is shaded. Results must match both ideas.\" width=\"140\" height=\"84\" viewBox=\"0 0 140 84\">\n                    <defs><clipPath id=\"andclip\"><circle cx=\"52\" cy=\"42\" r=\"34\"><\/circle><\/clipPath><\/defs>\n                    <circle cx=\"52\" cy=\"42\" r=\"34\" fill=\"#FFFFFF\" stroke=\"#012169\" stroke-width=\"2\"><\/circle>\n                    <circle cx=\"88\" cy=\"42\" r=\"34\" fill=\"#FFFFFF\" stroke=\"#012169\" stroke-width=\"2\"><\/circle>\n                    <circle cx=\"88\" cy=\"42\" r=\"34\" fill=\"#012169\" fill-opacity=\"0.75\" clip-path=\"url(#andclip)\"><\/circle>\n                    <circle cx=\"52\" cy=\"42\" r=\"34\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\"><\/circle>\n                    <text x=\"34\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1B2333\">AI<\/text>\n                    <text x=\"108\" y=\"47\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B2333\">writing<\/text>\n                  <\/svg>\n                  <figcaption style=\"font-size: 14px; line-height: 1.4; text-align: center; color: #1B2333\"><strong style=\"font-family: 'IBM Plex Mono', monospace\">AND<\/strong> narrows: both ideas needed<\/figcaption>\n                <\/figure>\n              <\/div>\n            <\/div>\n            <div style=\"font-size: 14px; line-height: 1.5; color: #46506A\">Quotation marks keep a phrase together, like \"college writing\".<\/div>\n\n            <sc-if value=\"{{notSimple}}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n                <button type=\"button\" onClick=\"{{checkSort}}\" style=\"min-height: 48px; padding: 0 24px; border-radius: 10px; border: none; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">Check my strategy<\/button>\n                <button type=\"button\" onClick=\"{{resetSort}}\" style=\"min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">Start over<\/button>\n              <\/div>\n            <\/sc-if>\n            <sc-if value=\"{{showSortFb}}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"status\" style=\"{{sortFbStyle}}\">\n                <div style=\"display: flex; align-items: center; gap: 8px; font-weight: 800\">\n                  <sc-if value=\"{{sortGood}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#0B6E69\"><circle cx=\"12\" cy=\"12\" r=\"11\"><\/circle><path d=\"M7 12.5l3.2 3.2L17 9\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/sc-if>\n                  <sc-if value=\"{{sortBad}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#B04A00\"><circle cx=\"12\" cy=\"12\" r=\"11\"><\/circle><path d=\"M12 7v6M12 16.5v.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\/path><\/svg><\/sc-if>\n                  <span>{{sortHead}}<\/span>\n                <\/div>\n                <sc-for list=\"{{sortNotes}}\" as=\"n\" hint-placeholder-count=\"1\">\n                  <div>{{n}}<\/div>\n                <\/sc-for>\n                <sc-if value=\"{{showFix}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px\">\n                    <button type=\"button\" onClick=\"{{startSimple}}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: #F2C14E; color: #1B2333; font-size: 15px; font-weight: 700; cursor: pointer\">Fix them one at a time<\/button>\n                    <button type=\"button\" onClick=\"{{tryAgain}}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">I’ll fix them myself<\/button>\n                  <\/div>\n                <\/sc-if>\n              <\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-if>\n      <\/section>\n    <\/sc-if>\n\n    <sc-if value=\"{{isP4}}\" hint-placeholder-val=\"{{ false }}\">\n      <section aria-labelledby=\"s5\" style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n          <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Part 5 of 5 · Quick check 2<\/span>\n          <span style=\"font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #E8ECF6; color: #012169\">Step 1 · Explore<\/span>\n          <span style=\"font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #E8ECF6; color: #012169\">Step 5 · Get the source<\/span>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: center\">\n          <div style=\"flex: 0 0 auto; display: flex; align-items: center; gap: 12px\">\n            <div style=\"width: 96px; height: 132px; box-sizing: border-box; border: 1px solid #C9CDD4; background: #F7F7F5; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #333333\"><strong style=\"font-size: 12px\">Artificial Intelligence<\/strong><span>Elaine Rich<\/span><span style=\"margin-top: auto\">1983<\/span><\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #46506A\">\n              <span style=\"display: flex; align-items: center; gap: 6px\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#46506A\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"><\/path><\/svg>Found on Google<\/span>\n              <span style=\"padding: 3px 8px; border-radius: 6px; border: 1px dashed #8A8F99; width: fit-content\">No preview available<\/span>\n            <\/div>\n          <\/div>\n          <h2 id=\"s5\" style=\"flex: 1 1 420px; margin: 0; font-size: 22px; line-height: 1.45; color: #1B2333\">While exploring on Google, you come across <em>Artificial Intelligence<\/em> by Elaine Rich (1983). It sounds like a clear explanation of how AI works, useful background for your paper. But Google doesn’t have a preview or scan of it, just the cover and a short description. What’s your next move?<\/h2>\n        <\/div>\n        <div style=\"font-size: 16px; line-height: 1.6; color: #46506A\">Google and the catalog work best together: one helps you discover a book, the other helps you get it.<\/div>\n        <sc-for list=\"{{mc}}\" as=\"m\" hint-placeholder-count=\"4\">\n          <button type=\"button\" onClick=\"{{m.pick}}\" aria-pressed=\"{{m.pressed}}\" style=\"{{m.style}}\">{{m.label}}<\/button>\n        <\/sc-for>\n        <sc-if value=\"{{hasMc}}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"status\" style=\"{{mcFbStyle}}\">\n            <div style=\"display: flex; align-items: center; gap: 8px; font-weight: 800\">\n              <sc-if value=\"{{mcGood}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#0B6E69\"><circle cx=\"12\" cy=\"12\" r=\"11\"><\/circle><path d=\"M7 12.5l3.2 3.2L17 9\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/sc-if>\n              <sc-if value=\"{{mcBad}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#B04A00\"><circle cx=\"12\" cy=\"12\" r=\"11\"><\/circle><path d=\"M12 7v6M12 16.5v.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\/path><\/svg><\/sc-if>\n              <span>{{mcVerdict}}<\/span>\n            <\/div>\n            <div>{{mcFb}}<\/div>\n          <\/div>\n        <\/sc-if>\n      <\/section>\n    <\/sc-if>\n\n    <div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n      <sc-if value=\"{{hasBack}}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" onClick=\"{{back}}\" style=\"min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">← {{backLabel}}<\/button>\n      <\/sc-if>\n      <span><\/span>\n      <sc-if value=\"{{hasNext}}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" onClick=\"{{forward}}\" style=\"min-height: 48px; padding: 0 24px; border-radius: 10px; border: none; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">Continue: {{nextLabel}} →<\/button>\n      <\/sc-if>\n    <\/div>\n  <\/div>\n\n  <sc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(20,24,33,0.5); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box\">\n      <div role=\"dialog\" aria-label=\"All 3 activities done\" style=\"width: 100%; max-width: 520px; background: #FFFFFF; border-radius: 16px; border-top: 6px solid #2BA89E; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.3)\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E69\">All 3 activities done<\/div>\n        <div style=\"font-size: 24px; font-weight: 800; line-height: 1.25; color: #1B2333\">You know when to reach for Google and when to reach for the catalog.<\/div>\n        <div style=\"font-size: 15px; line-height: 1.6; color: #333333\">You compared the two at each step of research, built a search strategy, and took a book you found on Google to the catalog.<\/div>\n        <div style=\"background: #F4F6F9; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Up next · Lesson 2<\/div>\n          <div style=\"font-size: 17px; font-weight: 700; color: #1B2333\">Anatomy of a book record<\/div>\n          <div style=\"font-size: 14px; line-height: 1.55; color: #46506A\">Open the catalog record for Elaine Rich’s <em>Artificial Intelligence<\/em> and learn what each part tells you, all the way to the Locate map.<\/div>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <a href=\"Record.dc.html\" style=\"flex: 1 1 200px; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none\">Continue to Lesson 2<\/a>\n          <button type=\"button\" onClick=\"{{closeDone}}\" style=\"flex: 1 1 160px; min-height: 48px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">Review this lesson<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>", "code": "class Component extends DCLogic {\n  constructor(p) { super(p); this.state = { part: 0, stage: 0, seenStages: { 0: true }, picked: {}, conceptsChecked: false, sel: null, place: {}, sortChecked: false, simple: false, queue: [], qMiss: false, mc: null, doneDismissed: false }; }\n  renderVals() {\n    const st = this.state;\n    const fbBox = (good) => 'font-size:16px;line-height:1.6;padding:14px 16px;border-radius:10px;color:#262626;display:flex;flex-direction:column;gap:6px;' + (good ? 'background:#E3F4F2;border-left:0;border:1px solid #9FD3CE' : 'background:#FFF4EC;border:1px solid #F0C9A8');\n    const best = 'font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#D7EDEB;color:#0B5A55';\n    const ok = 'font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#EEF0F4;color:#46506A';\n\n    /* lesson parts */\n    const partNames = ['Scenario', 'How they differ', 'Research steps', 'Quick check 1', 'Quick check 2'];\n    const parts = partNames.map((name, i) => {\n      const on = st.part === i, past = i < st.part;\n      return { n: i + 1, name, current: on ? 'step' : 'false', go: () => this.setState({ part: i }),\n        style: 'display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:10px;cursor:pointer;' + (on ? 'background:#FFFFFF;border:2px solid #012169;color:#012169' : (past ? 'background:#FFFFFF;border:1px solid #D3D7DE;color:#1B2333' : 'background:transparent;border:1px solid #C9CFD9;color:#46506A')),\n        numStyle: 'width:28px;height:28px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;' + (on ? 'background:#012169;color:#FFFFFF' : (past ? 'background:#2BA89E;color:#0B1F1E' : 'background:#E1E5EC;color:#46506A')) };\n    });\n\n    const stageData = [\n      { name: 'Explore the topic', g: 'A great place to start. Skim overviews, news and encyclopedia articles to learn what people are saying and which words they use.', gTag: 'Best here', c: 'Can feel narrow before you know your topic. It finds books and media, not quick background.', cTag: 'Later' },\n      { name: 'Choose keywords', g: 'Understands full questions, so you can skip this step. That’s handy, but you don’t learn which words matter.', gTag: 'Optional', c: 'Matches the words in titles, subjects and summaries. A strategy of concepts and synonyms beats a whole sentence.', cTag: 'Needed' },\n      { name: 'Find sources', g: 'Millions of results from the whole web. Anyone can publish, and some top results are ads.', gTag: 'Use with care', c: 'Books, ebooks and media chosen by Duke Libraries for research. Filter by format, date, subject or library.', cTag: 'Best here' },\n      { name: 'Find more like it', g: 'Suggests results based on what other people clicked.', gTag: 'Hit or miss', c: 'Subject headings link every book on the same topic. On the shelf, books on the same subject sit side by side.', cTag: 'Best here' },\n      { name: 'Get the source', g: 'Can tell you a book exists, but usually shows only a preview, a store page or a paywall. Bring the title to the catalog to get the whole thing.', gTag: 'Starting point', c: 'Shows where a book is shelved and if it’s available, or opens it online through Duke. If Duke doesn’t have it, you can request it from another library.', cTag: 'Best here' }\n    ];\n    const tagStyle = (t) => (t === 'Best here' || t === 'Needed') ? best : ok;\n    const stages = stageData.map((g, i) => {\n      const on = st.stage === i, seen = !!st.seenStages[i];\n      return { n: i + 1, name: g.name, pressed: on ? 'true' : 'false',\n        pick: () => { const s = Object.assign({}, st.seenStages); s[i] = true; this.setState({ stage: i, seenStages: s }); },\n        dot: 'position:relative;z-index:1;width:' + (on ? 56 : 48) + 'px;height:' + (on ? 56 : 48) + 'px;margin-top:' + (on ? 0 : 4) + 'px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;box-sizing:border-box;' + (on ? 'background:#012169;color:#FFFFFF;border:4px solid #C7D2EC' : (seen ? 'background:#E8ECF6;color:#012169;border:2px solid #012169' : 'background:#FFFFFF;color:#46506A;border:2px solid #B9C1D0')),\n        labelStyle: 'font-size:15px;line-height:1.3;text-align:center;' + (on ? 'font-weight:800;color:#012169' : 'font-weight:600;color:#1B2333') };\n    });\n    const cur = stageData[st.stage];\n    const stage = Object.assign({}, cur, { gTagStyle: tagStyle(cur.gTag), cTagStyle: tagStyle(cur.cTag) });\n\n    /* Quick check 1, part 1: concepts */\n    const wordData = [\n      { t: 'How', key: false }, { t: 'is', key: false }, { t: 'generative AI', key: true }, { t: 'changing', key: false },\n      { t: 'ideas of', key: false }, { t: 'authorship', key: true }, { t: 'in', key: false }, { t: 'college writing', key: true }, { t: '?', key: false }\n    ];\n    const conceptsOk = wordData.every((w, i) => !!st.picked[i] === w.key);\n    const words = wordData.map((w, i) => {\n      const on = !!st.picked[i];\n      let look = on ? 'background:#012169;color:#FFFFFF;border:2px solid #012169' : 'background:#FFFFFF;color:#1B2333;border:1px solid #8A8F99';\n      if (st.conceptsChecked && on !== w.key) look = on ? 'background:#FFF4EC;color:#7A3A00;border:2px solid #C25E00' : 'background:#FFFFFF;color:#7A3A00;border:2px dashed #C25E00';\n      return { t: w.t, pressed: on ? 'true' : 'false',\n        pick: () => { if (st.conceptsChecked && conceptsOk) return; const p = Object.assign({}, st.picked); p[i] = !p[i]; this.setState({ picked: p, conceptsChecked: false }); },\n        style: 'min-height:44px;padding:0 16px;border-radius:22px;font-size:17px;font-weight:600;cursor:pointer;' + look };\n    });\n    const nPicked = wordData.filter((w, i) => st.picked[i]).length;\n    const conceptFb = conceptsOk\n      ? 'Generative AI, authorship and college writing. Now find other words for each one.'\n      : (nPicked !== 3 ? 'Pick exactly three concepts. You have ' + nPicked + '.' : 'Look for the nouns that name your topic. Words like how, changing and ideas of connect the concepts; they aren’t concepts themselves.');\n\n    /* Quick check 1, part 2: sort terms */\n    const C = [\n      { id: 'A', name: 'Generative AI' },\n      { id: 'B', name: 'Authorship' },\n      { id: 'C', name: 'College writing' },\n      { id: 'X', name: 'Leave out' }\n    ];\n    const terms = [\n      { t: 'ChatGPT', a: 'A', hint: 'It’s a tool people use to generate text.' },\n      { t: 'robots', a: 'X', hint: 'Would most books about this be about writing at all?' },\n      { t: 'composition', a: 'C', hint: 'It’s what many colleges call their first-year writing course.' },\n      { t: 'plagiarism', a: 'B', hint: 'It’s about who wrote something and who gets the credit.' },\n      { t: 'large language models', a: 'A', hint: 'This is the technology that powers AI chatbots.' },\n      { t: 'social media', a: 'X', hint: 'Is this one of the three ideas in your question?' },\n      { t: 'academic writing', a: 'C', hint: 'It’s the kind of writing you do for your classes.' },\n      { t: 'originality', a: 'B', hint: 'Ask yourself: whose work is this, really?' },\n      { t: 'artificial intelligence', a: 'A', hint: 'It’s a broader name for the technology in your question.' },\n      { t: 'changing', a: 'X', hint: 'Is it a topic, or a word that connects the topics?' },\n      { t: 'rhetoric', a: 'C', hint: 'It’s the study of how writing persuades readers.' },\n      { t: 'creativity', a: 'B', hint: 'People ask whether a machine can be an author, and whether it can be this.' }\n    ];\n    const chip = (sel, mark) => 'min-height:40px;padding:0 14px;border-radius:20px;font-size:15px;font-weight:600;cursor:pointer;' +\n      (mark === 'good' ? 'background:#E3F4F2;color:#0B5A55;border:2px solid #0B6E69' : mark === 'bad' ? 'background:#FFF4EC;color:#7A3A00;border:2px solid #C25E00' :\n      (sel ? 'background:#F2C14E;color:#1B2333;border:2px solid #C78A00' : 'background:#FFFFFF;color:#1B2333;border:1px solid #8A8F99'));\n    const bank = terms.map((x, i) => ({ x, i })).filter((o) => !st.place[o.i]).map((o) => ({\n      t: o.x.t, pressed: st.sel === o.i ? 'true' : 'false',\n      pick: () => this.setState({ sel: st.sel === o.i ? null : o.i }),\n      style: chip(st.sel === o.i, null)\n    }));\n    const cols = C.map((c) => {\n      const items = terms.map((x, i) => ({ x, i })).filter((o) => st.place[o.i] === c.id).map((o) => {\n        const mark = st.sortChecked ? (o.x.a === c.id ? 'good' : 'bad') : null;\n        return { t: o.x.t, aria: 'Send ' + o.x.t + ' back to the term list',\n          back: () => { if (st.simple) return; const p = Object.assign({}, st.place); delete p[o.i]; this.setState({ place: p, sortChecked: false }); },\n          style: chip(false, mark).replace('min-height:40px', 'min-height:36px').replace('font-size:15px', 'font-size:14px') };\n      });\n      const can = st.sel != null;\n      return { name: c.name, items,\n        add: () => { if (st.sel == null) return; const p = Object.assign({}, st.place); p[st.sel] = c.id; this.setState({ place: p, sel: null, sortChecked: false }); },\n        addLabel: can ? 'Add “' + terms[st.sel].t + '” here' : 'Select a term first',\n        addStyle: 'margin-top:auto;min-height:44px;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;' + (can ? 'background:#012169;color:#FFFFFF;border:none' : 'background:#F4F6F9;color:#5A6478;border:1px dashed #B9C1D0'),\n        boxStyle: 'display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:10px;min-height:190px;' + (c.id === 'X' ? 'background:#F4F6F9;border:1px dashed #8A8F99' : 'background:#FFFFFF;border:2px solid #012169') };\n    });\n    const q = (t) => t.indexOf(' ') >= 0 ? '\"' + t + '\"' : t;\n    const group = (id, concept) => '(' + [q(concept)].concat(terms.filter((x, i) => st.place[i] === id).map((x) => q(x.t))).join(' OR ') + ')';\n    const searchString = group('A', 'generative AI') + ' AND ' + group('B', 'authorship') + ' AND ' + group('C', 'college writing');\n    const placedN = Object.keys(st.place).length;\n    const wrong = terms.map((x, i) => ({ x, i })).filter((o) => st.place[o.i] && st.place[o.i] !== o.x.a);\n    const sortGood = placedN === terms.length && wrong.length === 0;\n    let sortHead = '', sortNotes = [];\n    if (placedN < terms.length) { sortHead = 'Not finished yet'; sortNotes = ['Sort all ' + terms.length + ' terms first. ' + (terms.length - placedN) + ' left.']; }\n    else if (sortGood) { sortHead = 'Strong strategy'; sortNotes = ['Each set of parentheses catches books that use different words for the same idea, and AND makes sure every result touches all three. You’ll try it in the catalog in Lesson 4.']; }\n    else { sortHead = 'Not quite: ' + wrong.length + ' of ' + terms.length + ' in the wrong place'; sortNotes = ['The ones marked in orange need to move. The rest are right. Want a simpler way to fix them? We’ll keep your correct terms and walk through the others one at a time, with a hint.']; }\n\n    const qi = st.queue.length ? st.queue[0] : null;\n    const qx = qi == null ? null : terms[qi];\n    const qOpts = C.map((c) => ({ name: c.name,\n      pick: () => {\n        if (qi == null) return;\n        if (c.id !== qx.a) { this.setState({ qMiss: true }); return; }\n        const p = Object.assign({}, st.place); p[qi] = c.id;\n        const rest = st.queue.slice(1);\n        this.setState({ place: p, queue: rest, qMiss: false, simple: rest.length > 0, sortChecked: rest.length === 0 });\n      },\n      style: 'min-height:48px;padding:0 18px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;' + (c.id === 'X' ? 'background:#F4F6F9;color:#1B2333;border:1px dashed #8A8F99' : 'background:#FFFFFF;color:#012169;border:2px solid #012169') }));\n\n    /* Quick check 2 */\n    const mcData = [\n      { label: 'Search the catalog for the title and author to see if Duke has a copy.', ok: true, fb: 'Google helped you discover the book; the catalog tells you whether Duke has it and where. Plenty of books, especially older ones, have no online preview, but they’re sitting on a library shelf. You’ll find this exact book in Lesson 2.' },\n      { label: 'Move on. If there’s no preview, you can’t read it.', ok: false, fb: 'No preview on Google doesn’t mean no access. Many books were never scanned, but Duke may have a print copy, or can get one for you from another library. Check the catalog before you give up on it.' },\n      { label: 'Buy a used copy online.', ok: false, fb: 'You could, but check the catalog first. Duke probably has it, or can get it for you, at no cost.' },\n      { label: 'Use the Google description in your paper instead of the book.', ok: false, fb: 'The description is a short blurb, not the book, and you can’t cite it as if you read the book. If it sounds useful, get the book itself through the catalog.' }\n    ];\n    const mc = mcData.map((m, i) => ({ label: m.label, pressed: st.mc === i ? 'true' : 'false', pick: () => this.setState({ mc: i }),\n      style: 'min-height:56px;padding:14px 18px;border-radius:12px;text-align:left;font-size:16px;line-height:1.5;cursor:pointer;color:#1B2333;' + (st.mc === i ? (m.ok ? 'background:#E3F4F2;border:2px solid #0B6E69' : 'background:#FFF4EC;border:2px solid #C25E00') : 'background:#FFFFFF;border:1px solid #B9C1D0') }));\n    const mcPick = st.mc == null ? null : mcData[st.mc];\n\n    const done = (Object.keys(st.seenStages).length === 5 ? 1 : 0) + (st.sortChecked && sortGood ? 1 : 0) + (mcPick && mcPick.ok ? 1 : 0);\n    return {\n      parts, isP0: st.part === 0, isP1: st.part === 1, isP2: st.part === 2, isP3: st.part === 3, isP4: st.part === 4,\n      hasBack: st.part > 0, backLabel: st.part > 0 ? partNames[st.part - 1] : '', back: () => this.setState({ part: Math.max(0, st.part - 1) }),\n      hasNext: st.part < 4, nextLabel: st.part < 4 ? partNames[st.part + 1] : '', forward: () => this.setState({ part: Math.min(4, st.part + 1) }),\n      stages, stage,\n      rows: [\n        { k: 'What it searches', g: 'The open web: anything anyone has posted.', c: 'What Duke Libraries own or subscribe to.' },\n        { k: 'Who chose it', g: 'An algorithm ranks pages; some top results are paid ads.', c: 'Librarians select materials for research and teaching.' },\n        { k: 'How you search', g: 'Full questions work fine.', c: 'Keywords and strategies work best: concepts joined with AND and OR.' },\n        { k: 'How you narrow', g: 'A few tools: date, news, images.', c: 'Filters for format, date, subject, language and library.' },\n        { k: 'Finding more', eft: 140px; right: 104px; top: 62px; bottom: 76px; background: #F5EA9B; border: 3px solid #D6CB78; display: flex; align-items: center; justify-content: center\">\n                  <button type=\"button\" onClick=\"{{hs.h.pick}}\" aria-label=\"h: Shelf range\" aria-pressed=\"{{hs.h.expanded}}\" style=\"{{hs.h.style}}\"><span style=\"font-size: 30px; font-weight: 800; line-height: 1.1; color: #333333; text-align: center\">BOOKS<br>Q - QR<\/span><span style=\"{{hs.h.badge}}\">h<\/span><\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <div style=\"flex: 1 1 280px; min-width: 0; display: flex\">\n              <sc-if value=\"{{mapTermOpen}}\" hint-placeholder-val=\"{{ false }}\">\n                <div aria-live=\"polite\" style=\"flex-grow: 1; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; border: 1px solid #D3D7DE; border-top: 5px solid #C8102E; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.55; color: #262626\">\n                  <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 30px; height: 30px; border-radius: 15px; background: #C8102E; color: #FFFFFF; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center\">{{cur.key}}<\/span><span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Term {{curN}} of {{total}}<\/span><\/div>\n                  <div style=\"font-size: 22px; font-weight: 800; line-height: 1.2; color: #1B2333\">{{cur.term}}<\/div>\n                  <div>{{cur.def}}<\/div>\n                  <div style=\"background: #FFF4D6; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5300\">Why it matters<\/div><div style=\"font-size: 14px\">{{cur.why}}<\/div><\/div>\n                  <div style=\"display: flex; gap: 8px; margin-top: auto\"><button type=\"button\" onClick=\"{{prev}}\" style=\"flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 14px; font-weight: 600; cursor: pointer\">Previous<\/button><button type=\"button\" onClick=\"{{next}}\" style=\"flex: 1; min-height: 44px; border-radius: 8px; border: none; background: #012169; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer\">{{nextLabel}}<\/button><\/div>\n                <\/div>\n              <\/sc-if>\n              <sc-if value=\"{{mapIdle}}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"flex-grow: 1; box-sizing: border-box; border-radius: 12px; border: 2px dashed #F2C14E; background: #FFF8E1; padding: 18px; display: flex; flex-direction: column; gap: 8px; justify-content: center\">\n                  <div style=\"font-size: 16px; font-weight: 700; color: #1B2333\">Explore the map<\/div>\n                  <div style=\"font-size: 15px; line-height: 1.55; color: #46506A\">The Locate map has three more parts to learn. Select <strong>f<\/strong>, <strong>g<\/strong> and <strong>h<\/strong>, outlined in red, and the explanation will show up here.<\/div>\n                <\/div>\n              <\/sc-if>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n\n  <sc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(20,24,33,0.5); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box\">\n      <div role=\"dialog\" aria-label=\"Lesson 2 complete\" style=\"width: 100%; max-width: 520px; background: #FFFFFF; border-radius: 16px; border-top: 6px solid #2BA89E; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.3)\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E69\">All 8 parts explored<\/div>\n        <div style=\"font-size: 24px; font-weight: 800; line-height: 1.25; color: #1B2333\">You can read a book record.<\/div>\n        <div style=\"font-size: 15px; line-height: 1.6; color: #333333\">You know where to find the availability, the call number and the Locate map, so you know the book is on Bostock, Floor 4, in the Q–QR shelves.<\/div>\n        <div style=\"background: #F4F6F9; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Up next · Lesson 3<\/div>\n          <div style=\"font-size: 17px; font-weight: 700; color: #1B2333\">Call numbers &amp; browsing the stacks<\/div>\n          <div style=\"font-size: 14px; line-height: 1.55; color: #46506A\">Decode Q335 .R53 1983 piece by piece, then browse the books shelved around it to find more for your topic.<\/div>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <a href=\"CallNumbers.dc.html\" style=\"flex: 1 1 200px; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none\">Continue to Lesson 3<\/a>\n          <button type=\"button\" onClick=\"{{closeDone}}\" style=\"flex: 1 1 160px; min-height: 48px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">Review this record<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>", "code": "class Component extends DCLogic {\n  constructor(p) { super(p); this.state = { sel: null, seen: {}, map: false, showDone: false, doneShown: false }; }\n  terms() {\n    return [\n      { key: 'a', place: 'right', term: 'Resource type', def: 'The label above the title tells you what kind of item this is: BOOK, Journal, Video, Audio and so on.', why: 'An online book is labeled BOOK too. Check the availability line (c) to see if it is on a shelf or Available Online.' },\n      { key: 'b', place: 'below', term: 'Title / author', def: 'The title comes before the slash and the author after it. Below it the author appears again, last name first, and then the date and publisher. “c1983” means copyright 1983.', why: 'Matching the exact title, author and date is how you know you found the edition you need.' },\n      { key: 'c', place: 'below', term: 'Availability', def: 'One line that sums up status, library, collection and call number: Available at Perkins/Bostock Library Stacks (Q335 .R53 1983).', why: 'Green “Available at…” means a copy should be on the shelf. “Available Online” means you read it on screen; there is nothing to walk to.' },\n      { key: 'd', place: 'above', term: 'Location & call number', def: 'Under Locations: the library (Perkins/Bostock), the collection (Stacks), the call number (Q335 .R53 1983) and how many copies are in.', why: 'The call number is the book’s address on the shelf. Write all of it down before you go.' },\n      { key: 'e', place: 'above-end', term: 'Locate', def: 'Opens a map of the floor where this call number is shelved.', why: 'It saves you guessing which building and floor to go to.' },\n      { key: 'f', term: 'Building', def: 'Perkins and Bostock are two connected buildings that share one catalog location. The map tells you which side the book is in.', why: 'The catalog says “Perkins/Bostock”, but you still have to walk into the right building.' },\n      { key: 'g', term: 'Area', def: 'The floor (or area) of the building where the shelves are.', why: 'Head for the stairs and go up to Floor 4.' },\n      { key: 'h', term: 'Shelf range', def: 'The highlighted shelves hold call numbers from Q to QR. Q335 falls in that range.', why: 'Once you’re in the range, follow the shelf-end labels to Q335, then .R53, then 1983.' }\n    ];\n  }\n  go(i, extra) {\n    const n = this.terms().length;\n    const s = Object.assign({}, this.state.seen); s[i] = true;\n    const all = Object.keys(s).length === n;\n    const next = Object.assign({ sel: i, seen: s, map: i >= 5 }, extra || {});\n    if (all && !this.state.doneShown) { next.showDone = true; next.doneShown = true; }\n    this.setState(next);\n  }\n  renderVals() {\n    const t = this.terms(), sel = this.state.sel, seen = this.state.seen, n = t.length;\n    const base = 'position:absolute;z-index:30;width:340px;max-width:80vw;box-sizing:border-box;background:#FFFFFF;border-radius:12px;border-top:5px solid #C8102E;box-shadow:0 14px 40px rgba(20,24,33,0.28),0 0 0 1px rgba(20,24,33,0.08);padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:400;line-height:1.55;color:#262626;text-align:left;white-space:normal;letter-spacing:normal;text-transform:none;';\n    const where = {\n      'right': 'left:calc(100% + 14px);top:-8px;',\n      'below': 'left:0;top:calc(100% + 10px);',\n      'above': 'left:0;bottom:calc(100% + 10px);',\n      'above-end': 'right:0;bottom:calc(100% + 10px);'\n    };\n    const hs = {};\n    t.forEach((x, i) => {\n      const on = i === sel, done = !!seen[i];\n      hs[x.key] = {\n        pick: () => (on ? this.setState({ sel: null }) : this.go(i)),\n        open: on, expanded: on ? 'true' : 'false',\n        pop: base + (where[x.place] || ''),\n        style: 'display:inline-flex;align-items:center;gap:10px;width:fit-content;min-height:44px;padding:4px 6px;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;font-size:inherit;background:' + (on ? '#FFF4D6' : (done ? 'transparent' : '#FFF8E1')) + ';border:' + (on ? '3px solid #C8102E' : (done ? '2px dashed #9FD3CE' : '2px dashed #C8102E')) + ';' + (!on && !done ? 'box-shadow:0 0 0 4px rgba(200,16,46,0.12)' : ''),\n        badge: 'width:24px;height:24px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#FFFFFF;background:' + (done && !on ? '#0B6E69' : '#C8102E')\n      };\n    });\n    const chips = t.map((x, i) => ({\n      key: x.key, label: x.key + ': ' + x.term, pick: () => this.go(i),\n      style: 'width:30px;height:30px;border-radius:15px;cursor:pointer;font-size:13px;font-weight:800;' + (i === sel ? 'background:#F2C14E;color:#1B2333;border:none' : (seen[i] ? 'background:#2BA89E;color:#0B1F1E;border:none' : 'background:transparent;color:#D5DAE3;border:1px solid #5A6478'))\n    }));\n    const cur = sel == null ? t[0] : t[sel];\n    const cnt = Object.keys(seen).length;\n    const map = this.state.map;\n    return {\n      hs, chips, cur, curN: (sel == null ? 0 : sel) + 1, seenCount: cnt, total: n,\n      nextLabel: sel === 4 ? 'Open the map' : (sel === n - 1 ? 'Finish' : 'Next term'),\n      mapOpen: map, notMap: !map,\n      mapTermOpen: map && sel != null && sel >= 5, mapIdle: map && (sel == null || sel < 5),\n      introHead: cnt === 0 ? 'Start here: select the highlighted parts of this record' : (cnt === n ? 'All 8 parts explored. Nice work.' : 'Keep going: ' + (n - cnt) + ' highlighted part' + (n - cnt === 1 ? '' : 's') + ' left'),\n      introStyle: 'display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;' + (cnt === n ? 'background:#E3F4F2;border:1px solid #9FD3CE' : 'background:#FFF8E1;border:2px solid #F2C14E'),\n      showDone: this.state.showDone,\n      closeDone: () => this.setState({ showDone: false }),\n      closePop: () => this.setState({ sel: null }),\n      closeMap: () => this.setState({ map: false, sel: null }),\n      barStyle: 'height:100%;background:#2BA89E;width:' + Math.round(cnt / n * 100) + '%',\n      prev: () => this.go(((sel == null ? 0 : sel) - 1 + n) % n),\n      next: () => {\n        if (sel === 4) { this.setState({ map: true, sel: null }); return; }\n ine to pull the book off the shelf. Add the <strong>two<\/strong> books that would help most with your paper on how AI is changing the way we write.<\/div>\n          <\/div>\n\n          <div style=\"display: flex; flex-direction: column; background: #F4F6F9; border-radius: 12px; padding: 4px 14px 12px\">\n            <div role=\"group\" aria-label=\"Shelf Q335 .R434 to Q335 .R93\" style=\"display: flex; gap: 8px; align-items: flex-end; padding: 18px 0 0; overflow-x: auto\">\n              <sc-for list=\"{{shelf}}\" as=\"b\" hint-placeholder-count=\"10\">\n                <button type=\"button\" onClick=\"{{b.pick}}\" aria-pressed=\"{{b.pressed}}\" aria-label=\"{{b.aria}}\" style=\"{{b.spine}}\">\n                  <span style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 700; line-height: 1.2; color: #FFFFFF; flex-grow: 1; overflow: hidden; text-align: left\">{{b.title}}<\/span>\n                  <span style=\"background: #FFFFFF; border-radius: 3px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #1B2333\">\n                    <sc-for list=\"{{b.parts}}\" as=\"p\" hint-placeholder-count=\"4\"><span>{{p}}<\/span><\/sc-for>\n                  <\/span>\n                  <sc-if value=\"{{b.listed}}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border-radius: 13px; background: #F2C14E; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2333\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\/path><\/svg><\/span>\n                  <\/sc-if>\n                <\/button>\n              <\/sc-for>\n            <\/div>\n            <div style=\"height: 14px; -placeholder-val=\"{{ false }}\">\n        <section aria-labelledby=\"pc\" style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Part 3 of 3 · Your topic has more than one neighborhood<\/div>\n            <h2 id=\"pc\" style=\"margin: 0; font-size: 24px; line-height: 1.35; color: #1B2333\">Each book is shelved under its main subject. A topic like AI and writing spreads across several areas.<\/h2>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px\">\n            <sc-for list=\"{{hoods}}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"border: 1px solid #D3D7DE; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column\">\n                <div aria-hidden=\"true\" style=\"{{h.shelfStyle}}\">\n                  <span style=\"{{h.b1}}\"><\/span><span style=\"{{h.b2}}\"><\/span><span style=\"{{h.b3}}\"><\/span><span style=\"{{h.b4}}\"><\/span><span style=\"{{h.b5}}\"><\/span>\n                <\/div>\n                <div style=\"padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1\">\n                  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: #1B2333\">{{h.range}}<\/div>\n                  <div style=\"font-size: 16px; font-weight: 700; color: #1B2333\">{{h.name}}<\/div>\n                  <div style=\"font-size: 15px; line-height: 1.55; color: #46506A\">{{h.what}}<\/div>\n                  <div style=\"display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5A6478; margin-top: auto; padding-top: 6px\"><svg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fil       <\/section>\n      <\/sc-if>\n\n      <div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n        <sc-if value=\"{{hasBack}}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" onClick=\"{{back}}\" style=\"min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">← {{backLabel}}<\/button>\n        <\/sc-if>\n        <span><\/span>\n        <sc-if value=\"{{hasNext}}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" onClick=\"{{forward}}\" style=\"min-height: 48px; padding: 0 24px; border-radius: 10px; border: none; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">Continue: {{nextLabel}} →<\/button>\n        <\/sc-if>\n      <\/div>\n    <\/div>\n\n    <div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Why browse the stacks?<\/div>\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n          <span style=\"width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E8ECF6; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4v16M9 4v16M14 6l4 14M3 20h18\"><\/path><\/svg><\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 16px; font-weight: 700; color: #1B2333\">Books on one subject sit together<\/div><div style=\"font-size: 15px; line-height: 1.55; color: #333333\">Call numbers group books by subject, so the shelf around one good book is full of related ones.<\/div><\/div>\n        <\/div>\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n          <span style=\"width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E8ECF6; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-4-4M8 11h6\"><\/path><\/svg><\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 16px; font-weight: 700; color: #1B2333\">You find books keywords miss<\/div><div style=\"font-size: 15px; line-height: 1.55; color: #333333\">A great book may not use your search words in its title. On the shelf you’ll see it anyway.<\/div><\/div>\n        <\/div>\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n          <span style=\"width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E8ECF6; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z\"><\/path><\/svg><\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 16px; font-weight: 700; color: #1B2333\">You can judge a book quickly<\/div><div style=\"font-size: 15px; line-height: 1.55; color: #333333\">Flip through the table of contents and index to see if it really fits, before you check it out.<\/div><\/div>\n        <\/div>\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n          <span style=\"width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E8ECF6; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M8 20h8M12 16v4\"><\/path><\/svg><\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 16px; font-weight: 700; color: #1B2333\">Online works too<\/div><div style=\"font-size: 15px; line-height: 1.55; color: #333333\">Many catalog records let you browse nearby call numbers on screen when you can’t get to the library.<\/div><\/div>\n        <\/div>\n      <\/div>\n      <div style=\"background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Shelf order, in short<\/div>\n        <sc-for list=\"{{rules}}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; gap: 12px; align-items: center\">\n            <span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #1B2333; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center\">{{r.n}}<\/span>\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <span style=\"font-size: 15px; font-weight: 600; color: #1B2333\">{{r.t}}<\/span>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #46506A\">{{r.ex}}<\/span>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <sc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(20,24,33,0.5); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box\">\n      <div role=\"dialog\" aria-label=\"All 3 parts done\" style=\"width: 100%; max-width: 520px; background: #FFFFFF; border-radius: 16px; border-top: 6px solid #2BA89E; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.3)\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E69\">All 3 parts done<\/div>\n        <div style=\"font-size: 24px; font-weight: 800; line-height: 1.25; color: #1B2333\">You can read a call number, and use it to browse.<\/div>\n        <div style=\"font-size: 15px; line-height: 1.6; color: #333333\">You decoded Q335 .R53 1983, found two strong books just by looking at its neighbors, and saw that one topic can live in several parts of the library.<\/div>\n        <div style=\"background: #F4F6F9; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478\">Up next · Lesson 4<\/div>\n          <div style=\"font-size: 17px; font-weight: 700; color: #1B2333\">Find an ebook<\/div>\n          <div style=\"font-size: 14px; line-height: 1.55; color: #46506A\">Build a focused search from a quick one, then track down an ebook on your topic that you can read tonight from your dorm.<\/div>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <a href=\"Search.dc.html\" style=\"flex: 1 1 200px; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #012169; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none\">Continue to Lesson 4<\/a>\n          <button type=\"button\" onClick=\"{{closeDone}}\" style=\"flex: 1 1 160px; min-height: 48px; border-radius: 10px; border: 1px solid #B9C1D0; background: #FFFFFF; color: #1B2333; font-size: 15px; font-weight: 600; cursor: pointer\">Review this lesson<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>", "code": "class Component extends DCLogic {\n  constructor(p) { super(p); this.state = { part: 0, seg: 0, order: null, sel: 3, list: {}, listChecked: false, hood: null, doneDismissed: false }; }\n  renderVals() {\n    const st = this.state;\n    const pick = (on, good) => 'min-height:52px;padding:12px 18px;border-radius:12px;text-align:left;font-size:16px;line-height:1.4;cursor:pointer;color:#1B2333;' + (on ? (good ? 'background:#E3F4F2;border:2px solid #0B6E69' : 'background:#FFF4EC;border:2px solid #C25E00') : 'background:#FFFFFF;border:1px solid #B9C1D0');\n    const fbBox = (good) => 'font-size:16px;line-height:1.6;padding:14px 16px;border-radius:10px;color:#262626;display:flex;flex-direction:column;gap:6px;' + (good ? 'background:#E3F4F2;border:1px solid #9FD3CE' : 'background:#FFF4EC;border:1px solid #F0C9A8');\n\n    const partNames = ['Read the address', 'Browse the neighborhood', 'More than one neighborhood'];\n    const parts = partNames.map((name, i) => {\n      const on = st.part === i, past = i < st.part;\n      return { n: i + 1, name, current: on ? 'step' : 'false', go: () => this.setState({ part: i }),\n        style: 'display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:10px;cursor:pointer;' + (on ? 'background:#FFFFFF;border:2px solid #012169;color:#012169' : (past ? 'background:#FFFFFF;border:1px solid #D3D7DE;color:#1B2333' : 'background:transparent;border:1px solid #C9CFD9;color:#46506A')),\n        numStyle: 'width:28px;height:28px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;' + (on ? 'background:#012169;color:#FFFFFF' : (past ? 'background:#2BA89E;color:#0B1F1E' : 'background:#E1E5EC;color:#46506A')) };\n    });\n\n    const segData = [\n      { text: 'Q', name: 'Class letters', def: 'One to three letters for the broad subject. Q is Science. Books on the same subject sit together on the shelf.' },\n      { text: '335', name: 'Class number', def: 'Narrows the subject. Q335 is where general books on artificial intelligence go. Read it as a whole number: 335 comes after 300.' },\n      { text: '.R53', name: 'Cutter number', def: 'Usually stands for the author or title (R for Rich). Read it as a decimal: .R53 comes after .R453, because .53 is more than .453.' },\n      { text: '1983', name: 'Year', def: 'The year the edition was published. It tells apart editions of the same book, oldest first.' }\n    ];\n    const segs = segData.map((g, i) => ({ text: g.text, pressed: st.seg === i ? 'true' : 'false', pick: () => this.setState({ seg: i }),\n      style: \"min-width:72px;min-height:64px;padding:0 18px;border-radius:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:#1B2333;\" + (st.seg === i ? 'background:#FFF4D6;border:3px solid #C8102E' : 'background:#FFFFFF;border:2px dashed #B9C1D0'),\n      labelStyle: \"font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;padding:1px 6px;border-radius:3px;\" + (st.seg === i ? 'background:#F2C14E;color:#1B2333' : 'color:#1B2333') }));\n\n    const orderData = [\n      { label: 'Q335 .R453 2018', ok: false, fb: 'Read the cutter as a decimal: .453 is less than .53, so this book comes before Rich’s, not after. You’ll meet it on the shelf in Part 2.' },\n      { label: 'Q335 .R58 1984', ok: true, fb: 'Same Q335 and R, and .58 comes after .53. You’ll meet this book on the shelf in Part 2.' },\n      { label: 'QA76 .M3 2010', ok: false, fb: 'Letters come first: every Q book is shelved before any QA book, so this one is further along.' }\n    ];\n    const order = orderData.map((o, i) => ({ label: o.label, pressed: st.order === i ? 'true' : 'false', pick: () => this.setState({ order: i }), style: \"font-family:'IBM Plex Mono',monospace;\" + pick(st.order === i, o.ok) }));\n    const oPick = st.order == null ? null : orderData[st.order];\n\n    const books = [\n      { parts: ['Q', '335', '.R434', '1990'], title: 'Readings in Uncertain Reasoning', by: 'Glenn Shafer & Judea Pearl, eds. · 1990', about: 'A collection of research articles on how AI systems reason with uncertain information, such as probabilistic expert systems. Technical and written for specialists.', color: '#3D5A80', score: 'no' },\n      { parts: ['Q', '335', '.R45', '1991'], title: 'Reasoning about Plans', by: 'James F. Allen et al. · 1991', about: 'Four linked studies of how AI systems plan actions over time and recognize other agents’ plans, built on a formal logic of time. Mostly logic and proofs.', color: '#4A5568', score: 'no' },\n      { parts: ['Q', '335', '.R453', '2018'], title: 'The Fourth Age', by: 'Byron Reese · 2018', about: 'How AI and robots could change jobs, creativity and what it means to be human, including whether computers can be creative or conscious. Written for general readers.', color: '#2F6F5E', score: 'yes' },\n      { parts: ['Q', '335', '.R53', '1983'], title: 'Artificial Intelligence', by: 'Elaine Rich · 1983', about: 'The textbook you came to find. It explains how AI systems work.', color: '#8A5A1E', score: 'anchor' },\n      { parts: ['Q', '335', '.R58', '1984'], title: 'The Binary Brain: Artificial Intelligence in the Age of Electronics', spine: 'The Binary Brain', by: 'David Ritchie · 1984', about: 'A science writer’s tour of early-1980s AI research, with lab visits and interviews. Interesting history, but written long before the AI tools you write with today.', color: '#2C6E8F', score: 'maybe' },\n      { parts: ['Q', '335', '.R62', '1996'], title: 'The Robot’s Dilemma, Revisited', by: 'Kenneth M. Ford & Zenon W. Pylyshyn, eds. · 1996', about: 'A follow-up collection on the frame problem: how an AI can tell what changes and what stays the same after an action. Philosophy and logic.', color: '#7A4E2D', score: 'no' },\n      { parts: ['Q', '335', '.R63', '1987'], title: 'The Robot’s Dilemma: The Frame Problem in Artificial Intelligence', spine: 'The Robot’s Dilemma', by: 'Zenon W. Pylyshyn, ed. · 1987', about: 'Essays by philosophers and computer scientists, including Daniel Dennett and Jerry Fodor, on the frame problem. Important in AI history, but far from writing.', color: '#5B4B8A', score: 'no' },\n      { parts: ['Q', '335', '.R855', '2024'], title: 'The Mind’s Mirror', by: 'Daniela Rus & Gregory Mone · 2024', about: 'An MIT roboticist and a science writer explain how AI works, how it can make people more productive and creative, and what we need to do to limit its risks.', color: '#6B3E75', score: 'yes' },\n      { parts: ['Q', '335', '.R86', '1995'], title: 'Artificial Intelligence: A Modern Approach', by: 'Stuart Russell & Peter Norvig · 1995', about: 'The first edition of the most widely used AI textbook. It explains how AI systems are built, not how they affect writing.', color: '#3F6B3A', score: 'no' },\n      { parts: ['Q', '335', '.R93', '1990'], title: 'Artificial Intelligence and Human Reason', by: 'Joseph F. Rychlak · 1990', about: 'A psychologist argues that human reasoning is driven by purpose and meaning in a way computer processing is not. Useful for big questions, but not about writing.', color: '#8C3B3B', score: 'maybe' }\n    ];\n    const shelf = books.map((b, i) => {\n      const on = st.sel === i;\n      const listed = !!st.list[i];\n      let ring = on ? '4px solid #F2C14E' : '2px solid rgba(0,0,0,0.15)';\n      if (st.listChecked && listed) ring = b.score === 'yes' ? '4px solid #2BA89E' : '4px solid #E07A2E';\n      return { parts: b.parts, title: (b.spine || b.title).replace(/’/g, \"'\"), listed, pressed: on ? 'true' : 'false',
