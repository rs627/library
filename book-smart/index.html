e one you came for, and neither has “writing” in its title, so a keyword search could have missed them. Most of this shelf is technical, which is why Part 3 looks at other neighborhoods.'; }\n    else { listVerdict = 'Not quite: ' + yesCount + ' of 2'; listFb = 'You found ' + yesCount + ' of the 2 best books. Look for recent books written for general readers about how AI changes the way people work and create. Pull a few more books off the shelf and read their descriptions.'; }\n\n    const shelfBits = (color) => {\n      const s = (h, c) => 'display:block;width:14px;height:' + h + 'px;border-radius:2px;background:' + c;\n      return { shelfStyle: 'display:flex;align-items:flex-end;gap:4px;height:64px;padding:0 18px;box-sizing:border-box;background:#F4F6F9;border-bottom:6px solid #7A5B3A',\n        b1: s(40, color), b2: s(52, '#B9C1D0'), b3: s(46, color), b4: s(36, '#8A93A6'), b5: s(50, color) };\n    };\n    const hoods = [\n      Object.assign({ range: 'Q334 – Q342', name: 'Artificial intelligence', what: 'How AI works, its history and its impact.', where: 'Bostock, Floor 4' }, shelfBits('#8A5A1E')),\n      Object.assign({ range: 'P98', name: 'Computational linguistics', what: 'How computers process and generate human language.', where: '[Check the Locate map]' }, shelfBits('#2F6F5E')),\n      Object.assign({ range: 'PE1404', name: 'Teaching college writing', what: 'Books on teaching English composition and rhetoric.', where: '[Check the Locate map]' }, shelfBits('#6B3E75'))\n    ];\n    const hoodQData = [\n      { label: 'Q334 – Q342 · Artificial intelligence', ok: false, fb: 'It’s about AI, but its main subject is teaching writing. Books are shelved by their main subject.' },\n      { label: 'P98 · Computational linguistics', ok: false, fb: 'Close, but this book is about teaching students, not about how computers process language.' },\n      { label: 'PE1404 · Teaching college writing', ok: true, fb: 'Its main subject is teaching writing, so it sits with other }}\">Physical items<\/button>\n            <span style=\"margin-left: auto; font-size: 13px; color: #333333\">Sort by <strong style=\"color: #012169\">Relevance<\/strong><\/span>\n          <\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n            <div style=\"flex: 1 1 180px; max-width: 220px; display: flex; flex-direction: column; font-size: 13px; color: #262626\">\n              <div style=\"font-weight: 700; padding: 8px 0; border-bottom: 1px solid #DDDDDD\">Filter your results<\/div>\n              <sc-for list=\"{{facets}}\" as=\"fc\" hint-placeholder-count=\"8\">\n                <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEEEEE\"><span>{{fc}}<\/span><span style=\"color: #012169; font-weight: 700\">+<\/span><\/div>\n              <\/sc-for>\n            <\/div>\n            <div style=\"flex: 999 1 420px; min-width: 0; border: 1px solid #DDDDDD; border-radius: 6px\">\n              <div style=\"padding: 10px 14px; border-bottom: 1px solid #DDDDDD; font-size: 13px; color: #333333; display: flex; gap: 12px; align-items: center\"><span style=\"width: 14px; height: 14px; border: 1px solid #8A8F99; border-radius: 2px\"><\/span><span>{{countLabel}}<\/span><span style=\"color: #012169\">10 per page ▾<\/span><\/div>\n              <sc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"10\">\n                <div style=\"{{r.rowStyle}}\">\n                  <span style=\"width: 14px; height: 14px; flex-shrink: 0; margin-top: 4px; border: 1px solid #8A8F99; border-radius: 2px\"><\/span>\n                  <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1\">\n                    <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #333333; letter-spacing: 0.04em\"><span><span style=\"display: inline-block; min-width: 18px; padding: 1px 5px; margin-right: 8px; border: 1px solid #DDDDDD; border-radius: 3px; text-align: center\">{{r.n}}<\/span>BOOK<\/span><span style=\"padding: 1px 6px; border-radius: 3px; background: #EEEEEE; color: #555555\">Paperpile<\/span><\/div>\n                    <button type=\"button\" onClick=\"{{r.pick}}\" style=\"padding: 0; border: none; background: transparent; text-align: left; font-size: 16px; line-height: 1.4; color: #012169; cursor: pointer; min-height: 28px\">{{r.title}}<\/button>\n                    <div style=\"font-size: 13px; color: #333333\">{{r.authors}}<\/div>\n                    <div style=\"font-size: 13px; color: #333333\">{{r.pub}}<\/div>\n                    <div style=\"{{r.pillStyle}}\"><sc-if value=\"{{r.notAvail}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 7px; height: 7px; border-radius: 4px; background: #E07A2E\"><\/span><\/sc-if>{{r.avail}}<\/div>\n                  <\/div>\n                <\/div>\n              <\/sc-for>\n              <div style=\"display: flex; justify-content: center; gap: 6px; padding: 16px; font-size: 13px; color: #333333\">\n                <span style=\"width: 28px; height: 28px; border-radius: 14px; border: 2px solid #012169; color: #012169; display: flex; align-items: center; justify-content: center; font-weight: 700\">1<\/span>\n                <span style=\"width: 28px; height: 28px; display: flex; align-items: center; justify-content: center\">2<\/span>\n                <span style=\"width: 28px; height: 28px; display: flex; align-items: center; justify-content: center\">3<\/span>\n                <span style=\"width: 28px; height: 28px; display: flex; align-items: center; justify-content: center\">4<\/span>\n                <span style=\"width: 28px; height: 28px; display: flex; align-items: center; justify-content: center\">5<\/span>\n                <span style=\"width: 28px; height: 28px; display: flex; align-items: center; justify-content: center\">›<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{isRecord}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 20px 32px 32px; display: flex; flex-direction: column; gap: 12px\">\n          <button type=\"button\" onClick=\"{{backToResults}}\" aria-label=\"Back to results\" style=\"width: 44px; height: 44px; border-radius: 22px; border: none; background: #EEF1F6; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M11 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <div style=\"font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #333333\">BOOK<\/div>\n          <div style=\"font-size: 26px; line-height: 1.25\"><strong style=\"font-weight: 700\">Rethinking writing education in the age of generative AI<\/strong> / edited by Chaoran Wang and Zhongfeng Tian.<\/div>\n          <div style=\"font-size: 14px; color: #333333\">Basgier, Christopher; Wang, Chaoran, editor; Tian, Zhongfeng, editor.<\/div>\n          <div style=\"font-size: 14px; color: #333333\">2025; Taylor &amp; Francis; Abingdon, England ; New York, New York : Routledge<\/div>\n          <div style=\"display: inline-flex; align-items: center; width: fit-content; padding: 5px 14px; border: 2px solid #012169; border-radius: 8px; font-size: 14px; font-weight: 600; color: #012169\">Available Online<\/div>\n          <div style=\"border-top: 1px solid #B9A99A; margin-top: 16px; padding-top: 18px; font-size: 22px\">View Online<\/div>\n          <div style=\"background: #F0EFEE; border-radius: 4px; padding: 20px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.5\">\n              <div style=\"font-weight: 600; color: #012169\">Full text available at: [eBook platform]<\/div>\n              <div style=\"color: #333333\">Available from 2025.<\/div>\n            <\/div>\n            <button type=\"button\" onClick=\"{{openOnline}}\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 2px solid #F2C14E; background: #FFF8E6; cursor: pointer; font-size: 15px; font-weight: 600; color: #012169\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v6H4V6h6\"><\/path><\/svg>Read online<\/button>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{isAccess}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 40px 32px; display: flex; justify-content: center; background: #F4F6F9; min-height: 320px; box-sizing: border-box\">\n          <div style=\"width: 100%; max-width: 560px; background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px; align-self: flex-start\">\n            <div style=\"width: 48px; height: 48px; border-radius: 24px; background: #E8ECF6; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#012169\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 11V7a4 4 0 018 0v4\"><\/path><\/svg><\/div>\n            <div style=\"font-size: 20px; font-weight: 700; color: #1B2333\">You’re off campus, so the ebook site asks you to sign in before it opens.<\/div>\n            <div style=\"font-size: 15px; line-height: 1.6; color: #46506A\">This step is shown as a description only. In the real catalog you’d s   /* ---- holes ---- */
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(expr, scope) {
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function attrValue(raw, scope) {
    var m = raw.match(WHOLE);
    if (m) return lookup(m[1], scope);
    return raw.replace(ANY, function (_, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  function interp(text, scope) {
    return text.replace(ANY, function (_, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  var EVENTS = { onClick: 'click', onChange: 'input', onInput: 'input', onKeyDown: 'keydown', onKeyUp: 'keyup', onFocus: 'focusin', onBlur: 'focusout' };

  /* ---- render template -> fresh DOM nodes ---- */
  function renderNodes(parent, scope) {
    var out = [];
    parent.childNodes.forEach(function (n) { out.push.apply(out, renderNode(n, scope)); });
    return out;
  }
  function renderNode(n, scope) {
    if (n.nodeType === 3) return [document.createTextNode(interp(n.nodeValue, scope))];
    if (n.nodeType !== 1) return [];
    var tag = n.localName;
    if (tag === 'helmet' || tag === 'dc-import') return [];
    if (tag === 'sc-if') return attrValue(n.getAttribute('value') || '', scope) ? renderNodes(n, scope) : [];
    if (tag === 'sc-for') {
      var list = attrValue(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item', out = [];
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        out.push.apply(out, renderNodes(n, s));
      });
      return out;
    }
    var el = n.namespaceURI === 'http://www.w3.org/1999/xhtml' ? document.createElement(tag) : document.createElementNS(n.namespaceURI, tag);
    el.__on = {};
    Array.prototype.forEach.call(n.attributes, function (a) {
      var name = a.name;
      if (name.indexOf('hint-') === 0) return;
      var reactName = name.replace(/^on([a-z])/, function (_, c) { return 'on' + c.toUpperCase(); });
      var evt = null;
      Object.keys(EVENTS).forEach(function (k) { if (k.toLowerCase() === name.toLowerCase()) evt = EVENTS[k]; });
      if (evt) { var fn = attrValue(a.value, scope); if (typeof fn === 'function') el.__on[evt] = fn; return; }
      var v = attrValue(a.value, scope);
      if ((tag === 'input' || tag === 'textarea') && name === 'value') { el.__value = v == null ? '' : String(v); el.value = el.__value; return; }
      if (v === false || v == null) return;
      el.setAttribute(name, v === true ? '' : String(v));
    });
    renderNodes(n, scope).forEach(function (c) { el.appendChild(c); });
    return [el];
  }

  /* ---- patch live DOM so focus and typing survive re-renders ---- */
  function patch(parent, nodes) {
    var live = Array.prototype.slice.call(parent.childNodes);
    nodes.forEach(function (n, i) {
      var l = live[i];
      if (!l) { parent.appendChild(n); return; }
      if (l.nodeType !== n.nodeType || (n.nodeType === 1 && (l.localName !== n.localName || l.namespaceURI !== n.namespaceURI))) { parent.replaceChild(n, l); return; }
      if (n.nodeType === 3) { if (l.nodeValue !== n.nodeValue) l.nodeValue = n.nodeValue; return; }
      Array.prototype.slice.call(l.attributes).forEach(function (a) { if (!n.hasAttribute(a.name)) l.removeAttribute(a.name); });
      Array.prototype.forEach.call(n.attributes, function (a) { if (l.getAttribute(a.name) !== a.value) l.setAttribute(a.name, a.value); });
      l.__on = n.__on;
      if (n.__value !== undefined && l.value !== n.__value) l.value = n.__value;
      patch(l, Array.prototype.slice.call(n.childNodes));
    });
    for (var i = nodes.length; i < live.length; i++) parent.removeChild(live[i]);
  }

  function render(newPage) {
    var inst = instance(current);
    var scope = Object.assign(Object.create(null), inst.renderVals());
    var nodes = renderNodes(template(current), scope);
    if (newPage) app.textContent = '';
    patch(app, nodes);
    placeOverlays();
    renderTabs();
    sendHeight();
    if (newPage) {
      document.title = PAGES[current].title + ' · Book Smart';
      app.scrollTop = 0;
      window.scrollTo(0, 0);
      if (root.classList.contains('bs-auto')) postParent({ subject: 'lti.scrollToTop' });
      app.focus({ preventScroll: true });
    }
  }
  function renderTabs() {
    tabs.textContent = '';
    NAV.forEach(function (p) {
      var b = document.createElement('button');
      var open = !!unlocked[p[0]];
      b.type = 'button';
      b.className = 'bs-tab' + (p[0] === current ? ' on' : '') + (open ? '' : ' locked');
      b.textContent = p[1];
      if (p[0] === current) b.setAttribute('aria-current', 'page');
      if (open) b.addEventListener('click', function () { go(p[0]); });
      else { b.disabled = true; b.title = 'Finish the previous lesson to open this one'; b.setAttribute('aria-label', p[1] + ' (locked until you finish the previous lesson)'); }
      tabs.appendChild(b);
    });
  }
  function go(name) { if (PAGES[name]) { unlock(name); current = name; render(true); } }

  ['click', 'input', 'keydown', 'keyup', 'focusin', 'focusout'].forEach(function (type) {
    app.addEventListener(type, function (e) {
      if (type === 'click') {
        var a = e.target.closest('a[href]');
        if (a && /\.dc\.html$/.test(a.getAttribute('href'))) { e.preventDefault(); go(a.getAttribute('href').split('/').pop()); return; }
      }
      var el = e.target;
      while (el && el !== app) {
        if (el.__on && el.__on[type]) { el.__on[type](e); return; }
        el = el.parentNode;
      }
    });
  });

  render(true);
})();

</script>
</body>
</html>
