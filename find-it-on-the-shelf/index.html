<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find It on the Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#012169;--navy2:#00539B;--ink:#1B2333;--text:#262626;--muted:#46506A;--muted2:#5A6478;
  --line:#D3D7DE;--line2:#B9C1D0;--bg:#E9ECF1;--soft:#F4F6F9;
  --amber:#F2C14E;--amberbg:#FFF4D6;--red:#C8102E;
  --good:#0B6E69;--goodbg:#E3F4F2;--teal:#2BA89E;--bad:#C25E00;--badbg:#FFF4EC;
  --avail:#4F6B00;--availb:#A4C639;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);line-height:1.5}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;color:var(--ink)}

/* top nav */
.topnav{background:var(--ink);color:#fff}
.topnav-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{font-weight:800;font-size:17px;margin-right:auto}
.brand small{display:block;font-size:12px;font-weight:600;color:#C9D0DC;letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #3A4458;background:transparent;color:#D5DAE3;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.tab .ck{color:var(--teal)}
.tab.on .ck{color:var(--good)}

.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:1000px}
.hero{background:var(--ink);color:#fff;border-radius:12px;padding:18px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.hero h1{color:#fff;font-size:24px;font-weight:800;outline:none}
.hero p{margin:4px 0 0;color:#D5DAE3;font-size:15px;max-width:780px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.hero .eyebrow{color:var(--amber)}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:14px;font-weight:600;color:#D5DAE3}
.bar{width:220px;max-width:100%;height:8px;border-radius:4px;background:#3A4458;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--teal)}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:22px;line-height:1.35}
.lead{font-size:15px;color:var(--muted);margin:0}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:20px}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:21px}}

.opt{min-height:48px;padding:12px 16px;border-radius:10px;text-align:left;font-size:16px;line-height:1.5;color:var(--ink);background:#fff;border:1px solid var(--line2)}
.opt.sel{background:var(--amberbg);border:3px solid #C78A00}
.opt.good{background:var(--goodbg);border:2px solid var(--good)}
.opt.bad{background:var(--badbg);border:2px solid var(--bad)}
.opt.mono{font-family:var(--mono);font-size:15px}
.big{display:flex;align-items:center;gap:14px;min-height:72px;font-size:18px;font-weight:700}
.fb{font-size:16px;line-height:1.6;padding:14px 16px;border-radius:10px;color:var(--text)}
.fb.good{background:var(--goodbg)}.fb.bad{background:var(--badbg)}.fb.info{background:var(--soft)}
.btn{min-height:48px;padding:0 22px;border-radius:10px;font-size:15px;font-weight:700;border:none;background:var(--navy);color:#fff}
.btn2{min-height:48px;padding:0 20px;border-radius:10px;font-size:15px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--ink)}
.btn-amber{background:var(--amber);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* home */
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.num{width:40px;height:40px;border-radius:20px;background:var(--navy);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.lcard h3{font-size:20px;line-height:1.25}
.lcard p{margin:0;font-size:15px;color:var(--muted);flex-grow:1}
.lcard .mode{border-top:1px solid #E6E9EF;padding-top:10px;font-size:14px}
.lcard.soon{background:var(--soft);border-style:dashed}
.lcard.soon .num{background:var(--muted2)}

/* table */
.tbl{border:1px solid #DDD;border-radius:10px;overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) minmax(0,2fr);border-top:1px solid #E6E6E6;font-size:15px}
.tr:first-child{border-top:none;background:var(--soft);font-weight:700;font-size:14px;color:var(--ink)}
.tr>div{padding:12px 16px}
.tr>div:first-child{font-weight:700;color:var(--ink)}
@media (max-width:640px){.tr{grid-template-columns:1fr}.tr>div{padding:6px 14px}.tr>div:first-child{padding-top:12px}.tr:first-child{display:none}.tr>div[data-l]::before{content:attr(data-l) ": ";font-weight:700;color:var(--muted2)}}

.stage{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:84px;padding:12px 14px;border-radius:10px;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line2)}
.stage.seen{background:#E8ECF6;color:var(--navy);border:2px solid #E8ECF6}
.stage.on{background:var(--navy);color:#fff;border:2px solid var(--navy)}
.stage b{font-size:13px}.stage span{font-size:15px;font-weight:700;line-height:1.3}
.cmp{border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.cmp.cat{border:2px solid var(--navy)}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;font-weight:800}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#EEF0F4;color:var(--muted)}
.tag.best{background:#D7EDEB;color:#0B5A55}
.chip{min-height:44px;padding:0 16px;border-radius:22px;font-size:17px;font-weight:600;background:#fff;color:var(--ink);border:1px solid #8A8F99}
.chip.on{background:var(--navy);color:#fff;border:2px solid var(--navy)}
.chip.miss{color:#7A3A00;border:2px dashed var(--bad);background:#fff}
.chip.extra{color:#7A3A00;border:2px solid var(--bad);background:var(--badbg)}
.preview{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border:2px solid var(--line2);border-radius:24px;font-size:15px;flex:1 1 280px}

/* catalog replica */
.cat-frame{flex:999 1 640px;min-width:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.cat-top{background:var(--navy);color:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.cat-top .logo{font-size:13px;font-weight:800;letter-spacing:.06em;line-height:1.1;text-transform:uppercase}
.cat-top nav{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#E6ECF7}
.rec{padding:20px 28px 28px;display:flex;flex-direction:column;gap:12px}
.rec-type{font-size:13px;font-weight:500;letter-spacing:.04em;color:#333}
.rec-title{font-size:26px;line-height:1.25}
.rec-meta{font-size:14px;color:#333}
.pill{display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:6px 14px;border:2px solid var(--availb);border-radius:8px;font-size:14px;color:var(--avail)}
.pill .dot{width:8px;height:8px;border-radius:4px;background:#8DB600}
.pill.online{border-color:var(--navy);color:var(--navy)}
.pill.out{border-color:#E0A040;color:#7A4A00}
.pill.out .dot{background:#E0A040}
.locs-h{border-top:1px solid #B9A99A;margin-top:12px;padding-top:18px;font-size:22px}
.locs{background:#F0EFEE;border-radius:4px;padding:18px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.locs .lib{font-size:16px;font-weight:600;color:var(--navy)}
.avail-b{padding:6px 12px;border:2px solid var(--availb);border-radius:8px;font-size:14px;font-weight:600;color:var(--avail)}
.inplace-bar{background:var(--navy);height:44px;border-radius:6px 6px 0 0;margin:0 16px}
.inplace{margin:0 16px;border:1px solid #E1E1E1;padding:16px 20px;font-size:15px}
.hs{display:inline-flex;align-items:center;gap:10px;width:fit-content;max-width:100%;min-height:44px;padding:4px 6px;border-radius:8px;text-align:left;color:inherit;font-size:inherit;background:transparent;border:2px dashed #E6A3AE}
.hs.on{background:var(--amberbg);border:3px solid var(--red)}
.badge{width:24px;height:24px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:var(--red)}
.badge.done{background:var(--good)}
.plain{display:inline-flex;align-items:center;gap:10px}
.locate{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;border:2px solid var(--amber);background:#FFF8E6;font-size:15px;color:var(--navy)}
.overlay{position:absolute;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.modal{width:100%;max-width:760px;background:#fff;border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:22px}
.xbtn{width:44px;height:44px;border-radius:22px;border:none;background:#E8EAEE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;padding-bottom:12px;border-bottom:1px solid #DDD}
.mapbox{overflow-x:auto}
.map{border:10px solid #3A3A3A;background:#F4F3F1;height:380px;min-width:520px;position:relative}
.map>div{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#333}
.m-study{background:#D5EBCD;border:3px solid #8CC67F;font-size:15px}
.m-books{background:#F5EA9B;border:3px solid #D6CB78;font-size:30px;line-height:1.1}
.m-books .hs,.m-books .plain{font-weight:800;color:#333}
.term{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.term .k{width:36px;height:36px;border-radius:18px;background:var(--red);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.term h2{font-size:26px;line-height:1.2}
.why{background:var(--amberbg);border-radius:10px;padding:14px 16px}
.why .eyebrow{color:#7A5300}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dotbtn{width:44px;height:44px;border-radius:22px;font-size:16px;font-weight:800;background:#fff;color:var(--ink);border:1px solid var(--line2)}
.dotbtn.seen{background:#D7EDEB;color:var(--good);border:none}
.dotbtn.on{background:var(--red);color:#fff;border:none}

/* lesson 3 */
.seg{min-width:64px;min-height:64px;padding:0 18px;border-radius:10px;font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);background:#fff;border:2px dashed var(--line2)}
.seg.on{background:var(--amberbg);border:3px solid var(--red)}
.segdef{flex:1 1 300px;display:flex;flex-direction:column;gap:6px;background:var(--amberbg);border-radius:10px;padding:16px 18px}
.shelf-row{display:flex;gap:8px;align-items:flex-end;padding:16px 14px 0;overflow-x:auto}
.plank{height:14px;background:#7A5B3A;border-radius:3px}
.spine{position:relative;flex-shrink:0;width:72px;border-radius:5px;padding:10px 6px;display:flex;flex-direction:column;gap:8px;align-items:stretch;border:2px solid rgba(0,0,0,.15);transition:transform .15s}
.spine.on{border:4px solid var(--amber);transform:translateY(-10px)}
.spine.good{border:4px solid var(--teal)}.spine.bad{border:4px solid #E07A2E}
.spine .t{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:700;line-height:1.2;color:#fff;flex-grow:1;overflow:hidden;text-align:left}
.label{background:#fff;border-radius:3px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
.flag{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:13px;background:var(--amber);display:flex;align-items:center;justify-content:center}
.pulled{display:flex;flex-wrap:wrap;gap:16px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:18px}
.hood{border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hood .r{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink)}
.whyitem{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid #EEF0F4}

/* lesson 4 */
.search-band{background:var(--navy);padding:8px 24px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.search-band select{min-height:44px;border-radius:22px;border:none;padding:0 16px;font-size:14px;color:var(--text);background:#fff}
.sbox{flex:1 1 320px;max-width:640px;display:flex;align-items:center;background:#fff;border-radius:22px;padding:0 6px 0 18px;min-height:44px}
.sbox input{flex-grow:1;border:none;outline:none;font-size:15px;color:var(--text);min-height:40px;background:transparent;min-width:0}
.sbtn{width:40px;height:40px;border-radius:20px;border:none;background:#E6ECF7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.adv{font-size:13px;font-weight:600;color:#fff}
.res-wrap{max-width:1040px;margin:0 auto;padding:16px 24px 32px;display:flex;flex-direction:column;gap:14px}
.rtabs{display:flex;gap:28px;border-bottom:1px solid #DDD;font-size:13px}
.rtabs span{padding:8px 2px}
.rtabs .on{border-bottom:3px solid var(--navy);font-weight:700;color:var(--navy)}
.fchip{min-height:36px;padding:0 14px;border-radius:6px;font-size:13px;background:#fff;color:var(--text);border:1px solid #8A8F99}
.fchip.on{background:var(--navy);color:#fff;border:2px solid var(--navy)}
.facets{flex:1 1 180px;max-width:220px;font-size:13px}
.facets div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #EEE}
.facets div:first-child{font-weight:700;border-bottom:1px solid #DDD}
.facets b{color:var(--navy)}
.results{flex:999 1 420px;min-width:0;border:1px solid #DDD;border-radius:4px}
.results .cnt{padding:10px 14px;border-bottom:1px solid #DDD;font-size:13px;color:#333}
.result{display:flex;gap:14px;padding:16px 14px;border-bottom:1px solid #DDD}
.result.bad{background:var(--badbg);box-shadow:inset 4px 0 0 var(--bad)}
.thumb{width:44px;height:56px;flex-shrink:0;border:1px solid #C9CDD4;border-radius:3px;display:flex;align-items:center;justify-content:center;background:#FAFAFA}
.rtitle{padding:0;border:none;background:transparent;text-align:left;font-size:16px;color:var(--navy);min-height:28px}
.rtitle:hover{text-decoration:underline}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;background:#3A4458;color:#D5DAE3}
.step.on{background:var(--amber);color:var(--ink)}
.step.done{background:var(--teal);color:#0B1F1E}
.back{width:44px;height:44px;border-radius:22px;border:none;background:#EEF1F6;display:flex;align-items:center;justify-content:center}
.empty{padding:64px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-in">
    <div class="brand">Find It on the Shelf<small>Duke University Libraries · Information literacy</small></div>
    <nav class="tabs" id="tabs" aria-label="Lessons"></nav>
  </div>
</header>
<main id="app"></main>

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var cls = function () { return Array.prototype.filter.call(arguments, Boolean).join(' '); };
var B = function (act, arg, className, inner, attrs) {
  return '<button type="button" data-act="' + act + '" data-arg="' + (arg == null ? '' : arg) + '" class="' + (className || '') + '" ' + (attrs || '') + '>' + inner + '</button>';
};
var ICON = {
  check: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  back: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#012169" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  x: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#012169" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pin: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#012169"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>',
  search: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#012169" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  book: '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8"><path d="M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z"/></svg>',
  globe: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  books: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z"/></svg>'
};
var hero = function (eyebrow, title, sub, done, total, unit) {
  var meter = total ? '<div class="meter"><div>' + done + ' of ' + total + ' ' + unit + '</div><div class="bar"><span style="width:' + Math.round(done / total * 100) + '%"></span></div></div>' : '';
  return '<div class="hero"><div><div class="eyebrow">' + eyebrow + '</div><h1 tabindex="-1" id="pagetitle">' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + meter + '</div>';
};
var fb = function (good, text) { return '<div class="fb ' + (good ? 'good' : 'bad') + '" role="status">' + text + '</div>'; };
var pager = function (prev, next) {
  return '<div class="pager">' + (prev ? B('go', prev[0], 'btn2', '← ' + prev[1]) : '<span></span>') + (next ? B('go', next[0], 'btn', next[1] + ' →') : '') + '</div>';
};

/* ---------- state ---------- */
var S = {
  view: 'home',

}

function vL3() {
  var s = S.l3, d = prog.l3();
  var segs = L3.segs.map(function (g, i) { return B('l3seg', i, cls('seg', s.seg === i && 'on'), g.text, 'aria-pressed="' + (s.seg === i) + '"'); }).join('');
  var sg = L3.segs[s.seg];
  var oPick = s.order == null ? null : L3.order[s.order];
  var order = L3.order.map(function (o, i) { return B('l3order', i, cls('opt mono', s.order === i && (o.ok ? 'good' : 'bad')), o.label, 'aria-pressed="' + (s.order === i) + '"'); }).join('');
  var shelf = L3.books.map(function (b, i) {
    var on = s.sel === i, listed = !!s.list[i];
    var c = on ? 'on' : '';
    if (s.listChecked && listed) c = b.score === 'yes' ? 'good' : 'bad';
    return B('l3pull', i, cls('spine', c), '<span class="t">' + esc(b.title) + '</span><span class="label">' + b.parts.map(function (p) { return '<span>' + p + '</span>'; }).join('') + '</span>' + (listed ? '<span class="flag">' + ICON.check + '</span>' : ''),
      'style="height:' + (220 + (i % 3) * 18) + 'px;background:' + b.color + '" aria-pressed="' + on + '" aria-label="Pull ' + b.parts.join(' ') + ', ' + esc(b.title) + (listed ? ' (on your list)' : '') + '"');
  }).join('');
  var cb = L3.books[s.sel], inList = !!s.list[s.sel];
  var picked = Object.keys(s.list).map(Number);
  var yes = picked.filter(function (i) { return L3.books[i].score === 'yes'; }).length;
  var good = l3ListGood();
  var listFb = picked.length !== 2 ? 'Pick exactly two books. You have ' + picked.length + ' on your list.'
    : good ? 'Great picks. Machines That Read and Ghostwriters are both about AI and writing, and you found them just by looking at the books next to the one you came for. Neither has “writing” in its title, so a keyword search could have missed them.'
    : 'You found ' + yes + ' of the 2 best books. Look for the ones about language, authorship and writing. Pull a few more books off the shelf and read their descriptions.';
  var hPick = s.hood == null ? null : L3.hoodQ[s.hood];
  var hoods = L3.hoods.map(function (x) { return '<div class="hood" style="border-top:6px solid ' + x.color + '"><div class="r">' + x.range + '</div><strong style="color:var(--ink)">' + x.name + '</strong><div style="font-size:14px;color:var(--muted)">' + x.what + '</div><div style="font-size:13px;color:var(--muted2);margin-top:auto">Where: ' + x.where + '</div></div>'; }).join('');
  var hoodQ = L3.hoodQ.map(function (q, i) { return B('l3hood', i, cls('opt', s.hood === i && (q.ok ? 'good' : 'bad')), q.label, 'aria-pressed="' + (s.hood === i) + '"'); }).join('');

  return '<div class="wrap">' +
    hero('Lesson 3 of 5', 'Call numbers &amp; browsing the stacks', 'A call number gets you to one book. It also puts you among other books on the same subject. Learn to read one, then browse its neighbors.', d, 3, 'parts done') +
    '<div class="cols"><div class="main">' +

    '<section class="card" aria-labelledby="l3a"><div class="eyebrow">Part A · Read the address</div><h2 id="l3a">Select each part of the call number from Lesson 2</h2>' +
    '<div class="row" style="gap:24px;align-items:stretch"><div class="row">' + segs + '</div><div class="segdef" aria-live="polite"><strong style="font-size:18px;color:var(--ink)">' + sg.name + '</strong><div style="font-size:15px">' + sg.def + '</div></div></div>' +
    '<div style="border-top:1px solid #E6E9EF;padding-top:16px;display:flex;flex-direction:column;gap:12px"><strong style="color:var(--ink)">Quick check: which book sits right after Q335 .R53 1983 on the shelf?</strong>' +
    '<div class="row">' + order + '</div>' + (oPick ? fb(oPick.ok, oPick.fb) : '') + '</div></section>' +

    '<section class="card" aria-labelledby="l3b"><div class="eyebrow">Part B · Browse the neighborhood</div><h2 id="l3b">You found Elaine Rich’s book on Bostock, Floor 4. Before you leave, look at the books around it.</h2>' +
    '<p class="lead">Select a spine to pull the book off the shelf. Add the <strong>two</strong> books that would help most with your paper on how AI is changing the way we write.</p>' +
    '<div><div class="shelf-row" role="group" aria-label="Shelf Q334 to Q336">' + shelf + '</div><div class="plank"></div>' +
    '<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted2);padding:6px 4px 0"><span>← Q334</span><span>Q336 →</span></div></div>' +
    '<div class="pulled" aria-live="polite"><div style="flex:1 1 320px;display:flex;flex-direction:column;gap:6px"><div style="font-family:var(--mono);font-size:14px;color:var(--muted)">' + cb.parts.join(' ') + '</div>' +
    '<strong style="font-size:20px;line-height:1.3;color:var(--ink)">' + esc(cb.title) + '</strong><div style="font-size:14px;color:var(--muted)">' + cb.by + '</div><div style="font-size:15px">' + cb.about + '</div></div>' +
    '<div style="flex:0 1 220px">' + (cb.score === 'anchor' ? '<div class="fb good" style="font-size:14px;font-weight:700">The book you came for</div>' : B('l3add', '', inList ? 'btn2' : 'btn btn-amber', inList ? 'Remove from my list' : 'Add to my list')) + '</div></div>' +
    '<div class="row"><div><strong>My list:</strong> ' + (picked.length ? picked.map(function (i) { return esc(L3.books[i].title); }).join(' · ') : 'nothing yet') + '</div>' +
    '<span style="margin-left:auto">' + B('l3check', '', 'btn', 'Check my list') + '</span></div>' +
    (s.listChecked ? fb(good, listFb) : '') + '</section>' +

    '<section class="card" aria-labelledby="l3c"><div class="eyebrow">Part C · Your topic has more than one neighborhood</div><h2 id="l3c">Each book is shelved under its main subject. A topic like AI and writing spreads across several areas.</h2>' +
    '<div class="g3">' + hoods + '</div>' +
    '<div style="border-top:1px solid #E6E9EF;padding-top:16px;display:flex;flex-direction:column;gap:12px"><strong style="color:var(--ink)">Quick check: a book about using AI chatbots to teach first-year writing. Which neighborhood is it most likely in?</strong>' +
    hoodQ + (hPick ? fb(hPick.ok, hPick.fb) : '') + '</div></section>' +
    '</div>' +

    '<div class="side"><div class="card"><div class="eyebrow">Why browse the stacks?</div>' +
    L3.why.map(function (w) { return '<div class="whyitem"><strong style="color:var(--ink)">' + w[0] + '</strong><div style="font-size:15px">' + w[1] + '</div></div>'; }).join('') + '</div>' +
    '<div class="card" style="gap:10px"><div class="eyebrow">Shelf order, in short</div>' +
    L3.rules.map(function (r, i) { return '<div style="font-size:14px"><strong>' + (i + 1) + '.</strong> ' + r[0] + ' <span style="font-family:var(--mono);color:var(--muted)">' + r[1] + '</span></div>'; }).join('') + '</div></div></div>' +
    pager(['l2', 'Lesson 2'], ['l4', 'Lesson 4: Search']) + '</div>';
}

function vL4() {
  var s = S.l4;
  var steps = L4.steps.map(function (l, i) { return '<span class="' + cls('step', i === s.step && 'on', i < s.step && 'done') + '">' + (i + 1) + ' ' + l + '</span>'; }).join('');
  var body = '';
  if (s.step === 0) {
    body = '<div class="empty"><strong style="font-size:22px">Start by searching the catalog</strong><div style="color:#555;max-width:520px">Type a few keywords from the title and the author’s last name, then press the search button.</div></div>';
  } else if (s.step === 1) {
    var list = L4.results.filter(function (r) { return s.filter === 'all' || (s.filter === 'online' ? r.kind === 'online' : r.kind !== 'online'); });
    var rows = list.map(function (r, i) {
      return '<div class="' + cls('result', s.picked === r.id && !r.ok && 'bad') + '"><div class="thumb">' + ICON.book + '</div><div style="display:flex;flex-direction:column;gap:6px;min-width:0">' +
        '<div style="font-size:11px;color:#333;letter-spacing:.04em">' + (i + 1) + ' · BOOK</div>' + B('l4pick', r.id, 'rtitle', esc(r.title)) +
        '<div style="font-size:13px;color:#333">' + esc(r.authors) + '</div><div style="font-size:13px;color:#333">' + esc(r.pub) + '</div>' +
        '<div class="' + cls('pill', r.kind === 'online' && 'online', r.kind === 'out' && 'out') + '" style="font-size:12px;padding:4px 12px;margin-top:4px">' + (r.kind === 'online' ? '' : '<span class="dot"></span>') + esc(r.avail) + '</div></div></div>';
    }).join('');
    body = '<div class="res-wrap"><div class="rtabs" aria-hidden="true"><span class="on">All</span><span>Books</span><span>Video</span><span>Audio</span></div>' +
      '<div class="row" style="gap:10px"><span style="font-size:13px;font-weight:600;color:var(--navy)">All Filters</span>' +
      B('l4filter', 'online', cls('fchip', s.filter === 'online' && 'on'), 'Available online', 'aria-pressed="' + (s.filter === 'online') + '"') +
      B('l4filter', 'physical', cls('fchip', s.filter === 'physical' && 'on'), 'Physical items', 'aria-pressed="' + (s.filter === 'physical') + '"') +
      '<span style="margin-left:auto;font-size:13px">Sort by <strong style="color:var(--navy)">Relevance</strong></span></div>' +
      '<div class="row" style="align-items:flex-start;gap:20px"><div class="facets" aria-hidden="true"><div><span>Filter your results</span></div>' +
      ['Library', 'Resource Type', 'Subject', 'Genre', 'Language', 'Author/Creator', 'Creation Date', 'New Records'].map(function (f) { return '<div><span>' + f + '</span><b>+</b></div>'; }).join('') + '</div>' +
      '<div class="results"><div class="cnt">1–' + list.length + ' of ' + list.length + ' Results</div>' + rows + '</div></div></div>';
  } else {
    var plain = function (key, label, inner) {
      if (key === 'e') return B('l4map', '', 'locate', inner);
      return '<span class="plain">' + inner + '</span>';
    };
    body = '<div style="padding-top:12px;padding-left:28px">' + B('l4back', '', 'back', ICON.back, 'aria-label="Back to results"') + '</div>' + recordHTML(plain) +
      (s.step >= 3 ? '<div class="overlay">' + mapHTML(plain, 'l4close') + '</div>' : '');
  }

  var coach = '', label = 'Coach', bad = false;
  var pr = L4.results.filter(function (r) { return r.id === s.picked; })[0];
  if (s.step === 0) coach = s.note || 'Search with keywords, not a full sentence. Try words from the title plus the author’s last name, for example: artificial intelligence rich.';
  else if (s.step === 1) { bad = !!(pr && !pr.ok); coach = bad ? pr.fb : 'Which result is Elaine Rich’s 1983 print book? Check the title, the author, the date and the availability line. Tip: the Physical items filter hides online-only results.'; }
  else if (s.step === 2) coach = 'You found it. The availability line and the Locations section both say Perkins/Bostock Library Stacks, Q335 .R53 1983. Select Locate to see where that is.';
  else if (s.step === 3) { var c = s.choice == null ? null : L4.choices[s.choice]; bad = !!(c && !c.ok); coach = bad ? c.fb : 'Read the Building and Area at the top of the map, then find the shelf range that includes Q335.'; }
  else { label = 'Done'; coach = 'Nice work. You went from a search box to the exact shelf. Take the stairs to Floor 4 of Bostock and look for the Q – QR shelves.'; }

  var extra = '';
  if (s.step === 3) extra = '<strong style="color:var(--ink)">Where will you go to get the book?</strong>' + L4.choices.map(function (c, i) { return B('l4choice', i, cls('opt', s.choice === i && (c.ok ? 'good' : 'bad')), c.label); }).join('');
  if (s.step === 4) extra = '<div class="fb info"><div><strong>Building:</strong> Bostock</div><div><strong>Floor:</strong> 4</div><div><strong>Shelves:</strong> Books Q – QR</div><div><strong>Call number:</strong> Q335 .R53 1983</div></div>';

  return '<div class="wrap">' +
    '<div class="hero"><div style="max-width:760px"><div class="eyebrow">Lesson 4 of 5 · Your task</div><h1 tabindex="-1" id="pagetitle" style="font-size:20px;font-weight:700;line-height:1.35">For your Writing 120 paper on AI and writing, you want Elaine Rich’s classic <em>Artificial Intelligence</em> (1983). Find a print copy and work out exactly where to go.</h1></div><div class="steps">' + steps + '</div></div>' +
    '<div class="cols"><div class="cat-frame" style="min-height:640px">' + catTop() +
    '<div class="search-band"><label class="sr" for="scope">Search scope</label><select id="scope"><option>Books &amp; Media (Catalog)</option><option>Articles</option></select>' +
    '<div class="sbox"><label class="sr" for="q">Search the catalog</label><input id="q" type="search" autocomplete="off" value="' + esc(s.query) + '" placeholder="Search for books, articles, media and more">' + B('l4search', '', 'sbtn', ICON.search, 'aria-label="Search"') + '</div><span class="adv">Advanced Search</span></div>' +
    body + '</div>' +
    '<div class="side"><div class="card" aria-live="polite"><div class="eyebrow">' + (bad ? 'Try again' : label) + '</div><div class="' + (bad ? 'fb bad' : '') + '" style="font-size:16px;line-height:1.6">' + coach + '</div>' + extra + '</div>' +
    B('l4restart', '', 'btn2', 'Start over') + '</div></div>' +
    pager(['l3', 'Lesson 3'], ['home', 'Back to overview']) + '</div>';
}

/* ---------- actions ---------- */
var A = {
  go: function (v) { S.view = v; render(true); },
  l1start: function (v) { S.l1.start = v; },
  l1stage: function (i) { S.l1.stage = +i; S.l1.seen[i] = true; },
  l1word: function (i) { S.l1.picked[i] = !S.l1.picked[i]; S.l1.wordsChecked = false; },
  l1checkw: function () { S.l1.wordsChecked = true; },
  l1mc: function (i) { S.l1.mc = +i; },
  l2pick: function (i) { S.l2.sel = +i; S.l2.seen[i] = true; },
  l2step: function (dir) { var n = L2.length; A.l2pick((S.l2.sel + (+dir) + n) % n); },
  l2close: function () { A.l2pick(3); },
  l3seg: function (i) { S.l3.seg = +i; },
  l3order: function (i) { S.l3.order = +i; },
  l3pull: function (i) { S.l3.sel = +i; },
  l3add: function () { var l = S.l3.list; if (l[S.l3.sel]) delete l[S.l3.sel]; else l[S.l3.sel] = true; S.l3.listChecked = false; },
  l3check: function () { S.l3.listChecked = true; },
  l3hood: function (i) { S.l3.hood = +i; },
  l4search: function () {
    var s = S.l4, q = s.query.toLowerCase();
    if (!q.trim()) { s.note = 'Type something first: words from the title and the author’s last name.'; return; }
    if (/artificial|intelligence|rich/.test(q)) { s.step = 1; s.picked = null; s.choice = null; s.note = ''; return; }
    s.step = 0; s.note = 'No results for “' + esc(s.query) + '”. Use keywords from the title (artificial intelligence) or the author’s last name (Rich).';
  },
  l4filter: function (f) { S.l4.filter = S.l4.filter === f ? 'all' : f; },
  l4pick: function (id) { var r = L4.results.filter(function (x) { return x.id === id; })[0]; S.l4.picked = id; if (r.ok) S.l4.step = 2; },
  l4back: function () { S.l4.step = 1; S.l4.picked = null; },
  l4map: function () { S.l4.step = 3; S.l4.choice = null; },
  l4close: function () { S.l4.step = 2; },
  l4choice: function (i) { S.l4.choice = +i; if (L4.choices[i].ok) S.l4.step = 4; },
  l4restart: function () { S.l4 = { step: 0, query: '', note: '', filter: 'all', picked: null, choice: null }; }
};

/* ---------- render ---------- */
var app = document.getElementById('app'), tabs = document.getElementById('tabs');
var VIEWS = { home: vHome, l1: vL1, l2: vL2, l3: vL3, l4: vL4 };

function renderTabs() {
  tabs.innerHTML = B('go', 'home', cls('tab', S.view === 'home' && 'on'), 'Overview', S.view === 'home' ? 'aria-current="page"' : '') +
    LESSONS.map(function (l) {
      var done = prog[l.id]() >= totals[l.id], on = S.view === l.id;
      return B('go', l.id, cls('tab', on && 'on'), l.n + '. ' + l.short + (done ? ' <span class="ck">' + ICON.check + '</span><span class="sr">(complete)</span>' : ''), on ? 'aria-current="page"' : '');
    }).join('');
}

function render(newView) {
  var ae = document.activeElement;
  var key = ae && ae.dataset && ae.dataset.act ? [ae.dataset.act, ae.dataset.arg] : (ae && ae.id === 'q' ? ['#q'] : null);
  app.innerHTML = VIEWS[S.view]();
  renderTabs();
  if (newView) {
    window.scrollTo(0, 0);
    var t = document.getElementById('pagetitle'); if (t) t.focus({ preventScroll: true });
    return;
  }
  if (!key) return;
  var el = key[0] === '#q' ? document.getElementById('q')
    : document.querySelector('[data-act="' + key[0] + '"][data-arg="' + key[1] + '"]');
  if (el) el.focus({ preventScroll: true });
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.dataset.act;
  if (!A[act]) return;
  A[act](b.dataset.arg);
  if (act !== 'go') render(false);
});
document.addEventListener('input', function (e) { if (e.target.id === 'q') S.l4.query = e.target.value; });
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'q' && e.key === 'Enter') { e.preventDefault(); A.l4search(); render(false); }
});

render(true);
})();
</script>
</body>
</html>
